<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>rod-saude — registro diário</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0b1220; --bg2:#111c31; --card:#16233c; --card2:#1c2c49; --line:#25375a;
  --tx:#e8eefb; --tx2:#9fb0cd; --tx3:#6c7f9f;
  --ac:#38bdf8; --ok:#34d399; --wa:#fbbf24; --er:#f87171; --pr:#a78bfa; --cl:#d97757;
  --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(74px + var(--safe));
}
h1,h2,h3{margin:0;font-weight:650}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
input[type=number]{-moz-appearance:textfield}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

header{position:sticky;top:0;z-index:40;background:rgba(11,18,32,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  /* viewport-fit=cover faz o conteúdo subir por baixo da barra de status e da ilha
     dinâmica no iPhone. O env() devolve esse espaço ao cabeçalho. */
  padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:16px;letter-spacing:.2px;flex:1}
/* A navegação de data desceu para o fim do cabeçalho. No iPhone em modo app, a primeira
   linha fica embaixo da ilha dinâmica e da barra de status, e o toque não chegava aqui. */
.datenav{display:flex;align-items:center;gap:8px;margin-top:10px}
.datenav button{flex:0 0 52px;padding:10px 0;border-radius:10px;background:var(--card);
  border:1px solid var(--line);font-size:18px;line-height:1;color:var(--tx)}
.datenav button:active{background:var(--card2)}
.datenav .d{flex:1;font-size:14px;font-weight:700;text-align:center;color:var(--tx);
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 0}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--tx2);white-space:nowrap}
.badge.fds{background:#3a2a12;color:#fbbf24}

.metas{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.meta{background:var(--card);border-radius:10px;padding:6px 7px}
.meta .lb{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}
.meta .vl{font-size:14px;font-weight:700;line-height:1.2;margin-top:1px}
.meta .vl small{font-size:10px;font-weight:500;color:var(--tx3)}
.bar{height:4px;border-radius:2px;background:#0a1526;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--ac);transition:width .25s}
.bar i.ok{background:var(--ok)} .bar i.over{background:var(--er)} .bar i.pr{background:var(--pr)}

main{padding:12px 14px 20px;max-width:760px;margin:0 auto}
.tab{display:none} .tab.on{display:block}

.card{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:11px;overflow:hidden}
.chead{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;user-select:none}
.chead .hora{font-size:11px;font-weight:700;color:var(--ac);background:#0d2436;padding:2px 7px;border-radius:6px;letter-spacing:.3px;white-space:nowrap}
.chead .nm{flex:1;font-weight:600;font-size:14px}
.chead .kc{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums;text-align:right}
.chead .cv{font-size:12px;color:var(--tx3);transition:transform .2s}
.chead.open .cv{transform:rotate(90deg)}
.cbody{display:none;padding:0 13px 12px;border-top:1px solid var(--line)}
.cbody.open{display:block}
.card.done .chead .nm{color:var(--ok)}
.card.done{border-color:#1f5741}

.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(37,55,90,.5)}
.item:last-child{border-bottom:none}
.chk{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:transparent;background:var(--bg2)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06281c}
.item .txt{flex:1;font-size:13px;line-height:1.35}
.item .mac{font-size:10.5px;color:var(--tx3);margin-top:2px;font-variant-numeric:tabular-nums}
.item.on .txt{color:var(--tx)}
.item:not(.on) .txt{color:var(--tx2)}
.item.livre .txt{color:var(--wa)}
.qtd{width:58px;flex:none}
.qtd select{padding:5px 4px;font-size:12px;text-align:center}
.rmv{color:var(--er);font-size:17px;padding:2px 6px;flex:none;opacity:.75;background:none}

.rowb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{background:var(--card2);border:1px solid var(--line);padding:9px 13px;border-radius:10px;font-size:13px;font-weight:600}
.btn.p{background:var(--ac);color:#052539;border-color:var(--ac)}
.btn.g{background:#123528;color:var(--ok);border-color:#1f5741}
.btn.d{background:#33161a;color:var(--er);border-color:#5c2429}
.btn.c{background:var(--cl);color:#2a0f06;border-color:var(--cl)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:active{transform:scale(.97)}
.btn.wide{width:100%;justify-content:center;text-align:center}

.ctr{display:flex;align-items:center;gap:12px;padding:11px 13px}
.ctr .lbl{flex:1}
.ctr .lbl b{display:block;font-size:14px}
.ctr .lbl span{font-size:11.5px;color:var(--tx3)}
.ctr .num{font-size:19px;font-weight:700;min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.stp{width:38px;height:38px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-size:19px;font-weight:700;display:grid;place-items:center;flex:none}

.alert{display:flex;gap:9px;padding:10px 12px;border-radius:11px;margin-bottom:8px;font-size:12.5px;line-height:1.45;border:1px solid}
.alert .ic{font-size:14px;line-height:1.2;flex:none}
.alert b{display:block;margin-bottom:1px;font-size:13px}
.a-info{background:#0d2436;border-color:#1a4460;color:#bfe4f8}
.a-warn{background:#2d2410;border-color:#5c4a19;color:#fde5b0}
.a-good{background:#0f2b20;border-color:#1f5741;color:#bdf0d9}
.a-crit{background:#331418;border-color:#5c2429;color:#fbc9c9}

.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(37,55,90,.5);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--tx2)} .kv .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.kv .v em{font-style:normal;font-size:10.5px;color:var(--tx3);display:block;font-weight:400}
.v.hi{color:var(--wa)} .v.lo{color:var(--ac)} .v.gd{color:var(--ok)}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);margin:16px 0 7px;font-weight:700}
.pad{padding:11px 13px}
.muted{color:var(--tx3);font-size:12px;line-height:1.5}

.lsel{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:0 0 10px}
.lsel button{background:var(--c2);border:1px solid var(--bd);color:var(--tx2);border-radius:10px;padding:8px 0;font-size:13px;font-weight:700;font-family:inherit}
.lsel button.on{background:var(--ac);border-color:var(--ac);color:#04121f}
.tsel{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:11px}
.tsel button{padding:11px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:12px;color:var(--tx2)}
.tsel button.on{background:var(--ac);color:#052539;border-color:var(--ac)}
.tsel button.rest.on{background:var(--tx3);color:#0b1220;border-color:var(--tx3)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
.exh{display:flex;align-items:center;gap:9px;padding:10px 12px}
.exh .n{flex:1;font-weight:600;font-size:13.5px}
.serie{display:grid;grid-template-columns:26px 1fr 1fr 1fr 30px;gap:6px;align-items:center;padding:5px 12px}
.serie .ix{font-size:11px;color:var(--tx3);font-weight:700;text-align:center}
.serie input{padding:7px 5px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.shead{display:grid;grid-template-columns:26px 1fr 1fr 1fr 30px;gap:6px;padding:2px 12px 3px}
.shead span{font-size:9.5px;color:var(--tx3);text-align:center;text-transform:uppercase;letter-spacing:.5px}
.prev{font-size:10.5px;color:var(--tx3);padding:1px 12px 7px;font-variant-numeric:tabular-nums}

svg.spark{width:100%;height:80px;display:block}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--tx3);margin-top:5px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:repeat(6,1fr);
  background:rgba(17,28,49,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe)}
nav button{padding:9px 0 8px;display:grid;justify-items:center;gap:2px;color:var(--tx3);font-size:9.5px;font-weight:600}
nav button .i{font-size:18px;line-height:1}
nav button.on{color:var(--ac)}
nav button#n-claude{color:var(--cl)}
nav button#n-claude .i{font-size:17px}

.mask{position:fixed;inset:0;background:rgba(3,7,15,.75);z-index:60;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px 15px calc(20px + var(--safe))}
.sheet h3{font-size:15px;margin-bottom:4px}
.sheet .sub{font-size:12px;color:var(--tx3);margin-bottom:12px;line-height:1.45}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.fgrid label{font-size:11px;color:var(--tx3);display:block;margin-bottom:3px}
.f1{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;max-height:186px;overflow:auto}
/* registro de dor */
.dorEsc{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:4px}
.dorEsc button{padding:9px 0;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--tx3)}
.dorEsc button.on{background:var(--ac);border-color:var(--ac);color:#052539}
.dorEsc button.on.m{background:var(--wa);border-color:var(--wa);color:#2d2410}
.dorEsc button.on.a{background:var(--er);border-color:var(--er);color:#2a0f06}
.dorLb{display:flex;justify-content:space-between;font-size:10px;color:var(--tx3);margin-top:4px}
.chip2{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip2 button{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:12px;color:var(--tx2);line-height:1.2}
.chip2 button.on{background:var(--ac);border-color:var(--ac);color:#052539;font-weight:650}
.chip2 button.al{border-color:#5c2429;color:#f2a6a6}
.chip2 button.al.on{background:var(--er);border-color:var(--er);color:#2a0f06;font-weight:700}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:12px;color:var(--tx2)}
.chip.al{border-color:#5c4a19;color:#fbbf24}
.foto{width:100%;border-radius:11px;margin-bottom:10px;display:block;max-height:190px;object-fit:cover}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--safe));background:var(--ok);color:#06281c;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
code{background:#0a1526;padding:1px 5px;border-radius:5px;font-size:11.5px;color:var(--ac)}
pre{background:#0a1526;padding:10px;border-radius:9px;font-size:11px;overflow:auto;color:var(--tx2);margin:0 0 10px}
</style>
</head>
<body>

<div id="onb" class="onb"></div>

<header>
  <div id="pbar" class="pbar"></div>
  <div class="hrow">
    <h1 id="ttl">Hoje</h1>
    <span class="badge" id="bdg">—</span>
  </div>
  <div class="metas" id="metas"></div>
  <div class="datenav">
    <button onclick="mvDia(-1)" aria-label="dia anterior">‹</button>
    <span class="d" id="dlbl" onclick="irHoje()">—</span>
    <button onclick="mvDia(1)" aria-label="dia seguinte">›</button>
  </div>
</header>

<main>
  <section class="tab on" id="t-hoje"></section>
  <section class="tab" id="t-treino"></section>
  <section class="tab" id="t-medidas"></section>
  <section class="tab" id="t-saude"></section>
  <section class="tab" id="t-dados"></section>
</main>

<nav id="nav"></nav>

<div class="mask" id="mask" onclick="if(event.target===this)fechar()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>
<style>
.pbar{display:flex;align-items:center;gap:8px;padding:6px 14px 0;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden}
.pbar .qt{overflow:hidden;text-overflow:ellipsis}
.pbar .pnome{font-weight:700;color:var(--tx)}
.pbar select{background:var(--c2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:4px 8px;font-size:12px;font-family:inherit}
.pbar .tagm{background:var(--ac);color:#04121f;border-radius:6px;padding:1px 6px;font-size:10px;font-weight:800;letter-spacing:.4px}
.onb{display:none;position:fixed;inset:0;background:var(--c1);z-index:99;overflow:auto;padding:28px 18px 40px}
.onb.on{display:block}
.onb h2{font-size:20px;margin:0 0 6px}
.onb .sub{color:var(--tx2);font-size:13px;margin-bottom:18px;line-height:1.5}
.onb .pcard{background:var(--c2);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
</style>

<script>
/* ============================================================
   rod-saude MULTIPERFIL — versão 4-beta (15082026) · cache sw v2-beta
   Esta é a versão de TESTE, em /v2/. A versão 3, de perfil único, continua
   intacta na raiz e é a que roda no aparelho de uso diário.
   Aqui cada pessoa da família é um PERFIL separado dentro do mesmo app:
   dados, cardápio, exames e treino não se misturam entre perfis.
   Base: panorama de saúde 25072026 + plano nutricional 28072026 (whey 30 g)
        + RM de coluna 08082026 e comparação direta das imagens 2024/2025/2026
        + programa de treino ABCDE de 15082026 (Spring / Summer)
   Dados apenas neste aparelho (localStorage). Backup em Dados.
   ============================================================ */

/* ---------- 1. PLANO NUTRICIONAL PADRÃO ---------- */
/* Cada item é a UNIDADE (1 colher, 1 xícara, 1 ovo, 1 scoop de 30 g, 100 g).
   O campo q é a quantidade padrão do plano — o seletor abre para qualquer valor. */
const PLANO_PADRAO = [
  {id:'r1', hora:'04:30', nome:'Pré-treino', itens:[
    {n:'Banana média (100 g)', kcal:89, p:1.1, c:23, g:0.3},

    {n:'Mel — 1 col. sopa (20 g)', kcal:61, p:0, c:17, g:0},
    {n:'Água — 300 ml', kcal:0, p:0, c:0, g:0, agua:300},
    {n:'Limão (suco)', kcal:4, p:0.1, c:1, g:0},
    {n:'Beterraba — 1 col. sopa', kcal:5, p:0.1, c:0.8, g:0},
    {n:'Gengibre', kcal:1, p:0, c:0.2, g:0},
    {n:'Creatina — 7 g', kcal:0, p:0, c:0, g:0},
    {n:'Própolis verde — 20 gotas', kcal:0, p:0, c:0, g:0},
    {n:'Café puro — 1 xícara', kcal:2, p:0.3, c:0, g:0, q:2}
  ]},
  {id:'r2', hora:'07:15', nome:'Pós-treino — vitamina', itens:[
    {n:'Whey isolado — 1 scoop (30 g de pó) = 19,5 g de proteína', kcal:110, p:19.5, c:6.4, g:0.75, q:1.5},
    {n:'Banana média (100 g)', kcal:89, p:1.1, c:23, g:0.3},
    {n:'Mamão (100 g)', kcal:43, p:0.5, c:11, g:0.2},
    {n:'Abacate (70 g)', kcal:112, p:1.4, c:6, g:10.3},
    {n:'Mistura caseira — 1 col. sopa (11 g)', kcal:52, p:2, c:4.4, g:2.85, q:2},
    {n:'Água — 450 ml', kcal:0, p:0, c:0, g:0, agua:450},
    {n:'Cloreto de magnésio — 15 ml', kcal:0, p:0, c:0, g:0}
  ]},
  {id:'r3', hora:'07:40', nome:'Complemento', itens:[
    {n:'Ovo cozido — 1 unidade', kcal:78, p:6.3, c:0.6, g:5.3, q:3},
    {n:'Pasta de amendoim — ½ col. sopa (10 g)', kcal:59, p:2.4, c:1.9, g:5.1},
    {n:'Castanha-do-pará — 1 unidade (selênio)', kcal:26.5, p:0.55, c:0.5, g:2.7, q:2},
    {n:'Girassol + abóbora — ½ col. sopa', kcal:34, p:1.3, c:1, g:2.9},
    {n:'Café — 1 xícara', kcal:2, p:0.3, c:0, g:0, q:2}
  ]},
  {id:'r4', hora:'10:00', nome:'Lanche', itens:[
    {n:'Café — 1 xícara', kcal:2, p:0.3, c:0, g:0},
    {n:'Fruta: maçã, pera, laranja ou 2 kiwis', kcal:80, p:0.4, c:21, g:0.3},
    {n:'Iogurte grego natural desnatado (170 g)', kcal:100, p:17, c:6, g:0.5}
  ]},
  {id:'r5', hora:'12:30', nome:'Almoço', itens:[
    {n:'Alface à vontade', kcal:10, p:0.7, c:2, g:0.1},
    {n:'Tomate — 1 unidade', kcal:18, p:0.8, c:4, g:0.2},
    {n:'Rabanete', kcal:8, p:0.3, c:1.5, g:0},
    {n:'Cebola', kcal:9, p:0.2, c:1.5, g:0},
    {n:'Azeite extravirgem — 1 col. sopa', kcal:108, p:0, c:0, g:12},
    {n:'Vinagre de maçã', kcal:2, p:0, c:0.4, g:0},
    {n:'Mostarda — 1 col. chá', kcal:3, p:0, c:0.3, g:0},
    {n:'Orégano e pimenta calabresa', kcal:0, p:0, c:0.3, g:0},
    {n:'Arroz cozido — 1 col. sopa (25 g)', kcal:32, p:0.66, c:7, g:0.06, q:9},
    {n:'Feijão — 1 col. sopa (20 g)', kcal:15.25, p:0.975, c:2.725, g:0.1, q:8},
    {n:'Legume cozido — 1 concha (abóbora, chuchu, quiabo, cenoura)', kcal:50, p:1.5, c:10, g:0.5},
    {n:'Carne MAGRA — 100 g (patinho, coxão mole, frango, peixe, lombo)', kcal:170, p:22, c:0, g:8.5, q:1.8}
  ]},
  {id:'r6', hora:'17:00', nome:'Lanche', itens:[
    {n:'Whey isolado — 1 scoop (30 g de pó) = 19,5 g de proteína', kcal:110, p:19.5, c:6.4, g:0.75, q:0.5},
    {n:'Banana média (100 g)', kcal:89, p:1.1, c:23, g:0.3},
    {n:'Iogurte grego natural (100 g)', kcal:73, p:9, c:4, g:2.5},
    {n:'Fruta extra: mamão, melão ou abacaxi (150 g)', kcal:60, p:0.8, c:15, g:0.2}

function carregarDB(){
  try{

function arrumarDB(r){
  const db = Object.assign(dbVazio(), r);
  db.disp = Object.assign({fixo:'', master:false}, r.disp||{});
  db.perfis = db.perfis || {};
  for(const id in db.perfis) db.perfis[id] = migrar(mesclar(vazio('—'), db.perfis[id]));
  if(!db.perfis[db.atual]) db.atual = Object.keys(db.perfis)[0] || '';
  return db;

function mesclar(b, n){
  const o = Object.assign({}, b, n);
  o.cfg = Object.assign({}, b.cfg, n.cfg||{});
  o.bib = Object.assign({}, b.bib, n.bib||{});
  o.rot = Object.assign({}, b.rot, n.rot||{});
  o.notas = Object.assign({}, b.notas, n.notas||{});
  ['plano','labs','estrutural','perguntas','prazos','cuidados','meds'].forEach(k=>{
    o[k] = (n[k] && n[k].length) ? n[k] : b[k];
  });
  o.atualizacoes = n.atualizacoes || b.atualizacoes || [];
  return o;
}
function migrar(o){
  /* v1 -> v2: extras sem refeição passam a pertencer à 8ª refeição */
  Object.values(o.dias||{}).forEach(d=>{ (d.extras||[]).forEach(e=>{ if(!e.ref) e.ref='r8'; }); });
  /* v2 -> v3: programa ABCDE de 15082026, biblioteca substituída, HISTÓRICO PRESERVADO */
  if((o.v||0) < 3 && Object.keys(o.bib||{}).length){
    o.bib = {};
    for(const t in TREINO_SEED) for(const [l] of LOCAIS) o.bib[chaveBib(t,l)] = TREINO_SEED[t][l].ex.slice();
    o.atualizacoes = (o.atualizacoes||[]).concat([{d:'2026-08-15', txt:'Programa ABCDE — biblioteca de exercícios substituída. Histórico preservado.'}]);
  }
  /* v3 -> v4: o objeto 'exames' vira a lista 'prazos', que cada perfil monta a seu modo */
  if((o.v||0) < 4){
    if(o.exames && typeof o.exames==='object'){
      o.prazos = (o.prazos && o.prazos.length ? o.prazos : JSON.parse(JSON.stringify(PRAZOS_PADRAO)));
      o.prazos.forEach(p=>{ if(o.exames[p.k] !== undefined) p.d = o.exames[p.k]; });
      delete o.exames;
    }
    if(!o.cuidados || !o.cuidados.length) o.cuidados = [];
    if(!o.nome) o.nome = 'Perfil';
  }
  /* v5: cada letra passa a ter DUAS bibliotecas, uma por academia (A@summer, A@spring...).
     A biblioteca antiga, que era uma só por letra, é substituída pelas duas novas.
     O HISTÓRICO NÃO É TOCADO: cada treino registrado guarda sua própria lista e cargas. */
  o.bib = o.bib || {}; o.rot = o.rot || {}; o.notas = o.notas || {};
  if((o.v||0) < 5){
    for(const k of Object.keys(o.bib)) if(k.indexOf('@') < 0) delete o.bib[k];
    o.atualizacoes = (o.atualizacoes||[]).concat([{d:'2026-08-15', txt:'Treino por academia: cada letra passou a ter versão Summer e versão Spring. Histórico preservado.'}]);
  }
  for(const t in TREINO_SEED) for(const [l] of LOCAIS){
    const k = chaveBib(t,l);
    if(!Array.isArray(o.bib[k]) || !o.bib[k].length) o.bib[k] = TREINO_SEED[t][l].ex.slice();
    if(!o.rot[k]) o.rot[k] = TREINO_SEED[t][l].rot;
  }
  o.cfg = o.cfg || {}; if(!o.cfg.localPadrao) o.cfg.localPadrao = LOCAL_PADRAO;
  o.meds = Array.isArray(o.meds) ? o.meds : [];
  o.meds.forEach(m=>{ if(!m.id) m.id = novoMedId(); if(!m.horas) m.horas=['']; if(!m.dias) m.dias='todos'; });
  o.v = 5; return o;
}

function medsDoDia(d){
  const w = new Date(d+'T12:00').getDay();
  return (S.meds||[]).filter(m=>{
    if(m.ativo === false) return false;
    if(m.inicio && d < m.inicio) return false;
    if(m.fim && d > m.fim) return false;
    if(Array.isArray(m.dias) && !m.dias.map(String).includes(String(w))) return false;
    return true;
  });
}
function dosesDoDia(d){
  const L=[];
  medsDoDia(d).forEach(m=>(m.horas||['']).forEach(h=>L.push({m, h, k:m.id+'@'+h})));
  return L.sort((a,b)=>String(a.h).localeCompare(String(b.h)));
}

function medsReg(d){ return (D(d).meds) || {}; }
function medTomado(d,k){ return !!medsReg(d)[k]; }
function togMed(d,k){
  const dd=D(d); if(!dd.meds) dd.meds={};
  if(dd.meds[k]) delete dd.meds[k];
  else dd.meds[k] = new Date().toTimeString().slice(0,5);
  if(!Object.keys(dd.meds).length) delete dd.meds;

function hParaNum(h){ const m=/^(\d{1,2}):(\d{2})$/.exec(String(h||'')); return m? +m[1]+ +m[2]/60 : null; }
/* devolve as doses vencidas e não marcadas, com quantas horas de atraso */
function medsAtrasadas(d){
  const ehHoje = d===hoje();
  const agora = ehHoje ? new Date().getHours()+new Date().getMinutes()/60 : 24;
  return dosesDoDia(d).filter(x=>{
    if(medTomado(d,x.k)) return false;
    const hn = hParaNum(x.h); if(hn===null) return false;
    return agora >= hn + 0.5;
  }).map(x=>Object.assign({}, x, {atraso: agora - hParaNum(x.h)}));
}
function medsResumo(d){
  const tot = dosesDoDia(d).length;
  const feitas = dosesDoDia(d).filter(x=>medTomado(d,x.k)).length;

function metaDia(d){
  const f = fds(d), c = S.cfg;
  return f ? {kcal:c.kcalFds, p:c.protMeta, cb:Math.round(c.carbMeta*1.1), g:Math.round(c.gordMeta*1.1)}
           : {kcal:c.kcalSem, p:c.protMeta, cb:c.carbMeta, g:c.gordMeta};
}
function totais(d){
  const dd = D(d); let t={kcal:0,p:0,c:0,g:0,sat:0,doses:0,agua:dd.agua||0,itens:0};
  S.plano.forEach(r=>r.itens.forEach((it,i)=>{
    const q = dd.plano[r.id+'-'+i];
    if(q){ t.kcal+=it.kcal*q; t.p+=it.p*q; t.c+=it.c*q; t.g+=it.g*q; t.itens++;
           if(it.agua) t.agua += it.agua*q; }
  }));
  (dd.extras||[]).forEach(e=>{
    const q = e.q||1;
    t.kcal+=e.kcal*q; t.p+=e.p*q; t.c+=e.c*q; t.g+=e.g*q; t.itens++;
    if(e.sat) t.sat += e.g*q;
    if(e.dose) t.doses += e.dose*q;
    if(e.agua) t.agua += e.agua*q;
  });
  ['kcal','p','c','g','sat','agua'].forEach(k=>t[k]=Math.round(t[k]));
  t.doses = Math.round(t.doses*10)/10;
  return t;
}
function extrasDe(d, rid){ return (D(d).extras||[]).map((e,i)=>({e,i})).filter(x=>(x.e.ref||'r8')===rid); }
function refeicaoFeita(d, r){
  const dd=D(d);
  return r.itens.some((it,i)=>dd.plano[r.id+'-'+i]) || extrasDe(d, r.id).length>0;
}
function refeicaoCompleta(d, r){
  if(!r.itens.length) return false;
  const dd=D(d); return r.itens.every((it,i)=>dd.plano[r.id+'-'+i]);
}
function difDias(a,b){ return Math.round((new Date(b+'T12:00') - new Date(a+'T12:00'))/86400000); }
function fmtData(d){
  const dt=new Date(d+'T12:00');
  const sem=['dom','seg','ter','qua','qui','sex','sáb'][dt.getDay()];
  return sem+' '+String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0');
}
function ddmmaaaa(d){ if(!d) return '—'; const p=d.split('-'); return p[2]+p[1]+p[0]; }
function isoOf(dd){ return dd.slice(4)+'-'+dd.slice(2,4)+'-'+dd.slice(0,2); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nn(x){ return (Math.round(x*10)/10).toString().replace('.',',')+'g'; }

/* ---------- 7. MOTOR DE ALERTAS ---------- */
function alertas(d){
  const t = totais(d), m = metaDia(d), dd = D(d), c = S.cfg, a = [];
  const ehHoje = d === hoje();
  const hora = ehHoje ? new Date().getHours()+new Date().getMinutes()/60 : 23.9;
  const f = fds(d);

  if(t.doses > 0){
    if(t.doses > c.dosesMax)
      a.push(['crit','🍺','Acima do combinado: '+t.doses+' doses',
        nota('dosesAcima','O teto combinado é de '+c.dosesMax+' doses. O álcool é a fonte calórica mais fácil de esquecer e a que mais deposita na região abdominal.')]);
    else if(t.doses >= 4)
      a.push(['warn','🍺', t.doses+' doses — atenção ao teto',
        nota('dosesTeto','O teto é '+c.dosesMax+'. Alterne cada dose com um copo de água.')]);
    else
      a.push(['info','🍺', t.doses+' dose(s) registrada(s)',
        'Anotar as doses é a variável que decide o resultado. Coma proteína antes de beber.']);
  }
  const temPlano = (S.plano||[]).length > 0;
  if((hora >= 20 || t.itens >= 20) && (temPlano || t.itens > 0)){
    if(t.p < c.protMin)
      a.push(['warn','🥩','Proteína em '+t.p+' g — abaixo do alvo',
        'O alvo é '+c.protMeta+' g ('+(c.protMeta/c.peso).toFixed(2).replace('.',',')+' g/kg). Em déficit calórico com treino de força, a proteína é o que protege a massa magra. Uma opção rápida: iogurte grego, atum ou ovos.']);
    else
      a.push(['good','🥩','Proteína em '+t.p+' g — alvo cumprido','']);
  }
  if(hora >= 21 && S.plano[6] && !refeicaoFeita(d, S.plano[6]))
    a.push(['warn','🍽️','O jantar não foi registrado',
      nota('jantar','A última refeição do dia sustenta a proteína e evita a janela longa sem comida antes de dormir.')]);
  if(t.sat >= 30)
    a.push(['warn','🧀','Carga alta de gordura saturada hoje (~'+t.sat+' g em itens saturados)',
      nota('saturada','Carga alta de gordura saturada num dia só. Vale observar a média da semana.')]);
  if(t.agua > 0){
    const pct = t.agua / c.aguaMeta;
    if(hora >= 18 && pct < 0.7)
      a.push(['warn','💧','Hidratação em '+(t.agua/1000).toFixed(1).replace('.',',')+' L de '+(c.aguaMeta/1000).toFixed(1).replace('.',',')+' L',
        nota('agua','Hidratação abaixo do previsto para o horário.')]);
    else if(pct >= 1)
      a.push(['good','💧','Meta de água cumprida','']);
  }
  if(t.kcal > m.kcal * 1.15)
    a.push(['warn','🔥','Calorias em '+t.kcal+' — acima da meta de '+m.kcal,
      'Um dia acima não desfaz a semana. O que desfaz é a soma de sábado e domingo.']);
  else if(t.kcal >= m.kcal*0.9 && t.kcal <= m.kcal*1.05 && t.itens>10)
    a.push(['good','🎯','Dia dentro da meta calórica','']);
  if(f && t.itens===0 && temPlano)
    a.push(['info','📅','Fim de semana: meta de '+m.kcal+' kcal e teto de '+c.dosesMax+' doses',
        nota('fds','O fim de semana costuma ser onde a semana inteira é decidida.')]);

  const dt = new Date(d+'T12:00');
  if(ehHoje && dt.getDay() === c.diaPeso){
    const ultima = S.medidas.length ? S.medidas[S.medidas.length-1] : null;
    if(!ultima || difDias(ultima.data, d) >= 6)
      a.push(['info','⚖️','Hoje é dia de pesagem',
        'Em jejum, antes do treino, mesmo dia da semana. Registre na aba Medidas. Não pese diariamente.']);
  }
  /* ----- dor ----- */
  const alarmes = alarmesDe(d);
  if(alarmes.length)
    a.push(['crit','🚨','SINAL NEUROLÓGICO MARCADO HOJE: '+alarmes.join(', '),
      'Isto muda a categoria do problema. Não espere a consulta agendada: procure atendimento. Se houver dormência na região da sela ou qualquer alteração para urinar ou evacuar, vá ao pronto-socorro hoje — são os sinais que ninguém deixa para amanhã.']);
  const dorHoje = (D(d).dor||{}).n;
  if(dorHoje!=null){
    if(dorHoje>=7)
      a.push(['crit','📈','Dor em '+dorHoje+'/10',
        'Nível alto. Registre o que estava fazendo quando piorou — essa informação vale mais para o especialista do que o número sozinho. Considere poupar carga axial hoje.']);
    else if(dorHoje>=4)
      a.push(['warn','📈','Dor em '+dorHoje+'/10',
        'Dor moderada registrada. Vá anotando todo dia: a curva importa mais que o ponto.']);
  }
  else if(ehHoje && hora>=20 && difDias(d, hoje())===0)
    a.push(['info','📈','Dor de hoje ainda não registrada',
      'Trinta segundos por dia constroem o gráfico que o especialista vai querer ver. Zero também é resposta.']);

  /* ----- doses de medicamento vencidas ----- */
  const atrasadas = medsAtrasadas(d);
  if(atrasadas.length){
    const graves = atrasadas.filter(x=>x.atraso>=4);
    const lista = atrasadas.map(x=>x.m.n+' ('+x.h+')').join(', ');
    if(graves.length)
      a.push(['crit','💊','Dose em atraso de mais de 4 h: '+graves.map(x=>x.m.n).join(', '),
        'Não dobre a dose para compensar sem falar com quem prescreveu. Marque no app quando tomar, para a série de adesão ficar honesta.']);
    else
      a.push(['warn','💊','Dose pendente: '+lista,
        'Marque no cartão de medicamentos assim que tomar.']);
  }
  else if(dosesDoDia(d).length && medsResumo(d).feitas===dosesDoDia(d).length)
    a.push(['good','💊','Todas as doses do dia marcadas','']);

  /* ----- prazos e pendências DESTE perfil ----- */
  (S.prazos||[]).forEach(p=>{
    if(p.modo === 'pendente'){
      if(!p.d) a.push(['crit', p.ic||'🔔', p.t, p.m||'']);
      return;
    }
    if(!p.d) return;
    const dias = difDias(d, p.d);
    if(dias <= 30 && dias >= 0)
      a.push([dias<=7?'warn':'info', p.ic||'📆', p.t+' em '+dias+' dia(s) — '+ddmmaaaa(p.d), p.m||'']);
    else if(dias < 0)
      a.push(['warn', p.ic||'📆', p.t+' venceu há '+(-dias)+' dia(s)', 'Reagende na aba Saúde.']);
  });
  return a;
}

/* ---------- 8. CABEÇALHO ---------- */
function renderTopo(){
  document.getElementById('dlbl').textContent = dia===hoje() ? 'hoje, '+fmtData(dia) : fmtData(dia);
  const t = totais(dia), m = metaDia(dia);
  const bd = document.getElementById('bdg');
  bd.textContent = fds(dia) ? 'fim de semana' : 'dia de semana';
  bd.className = 'badge'+(fds(dia)?' fds':'');
  const cel = (lb, v, meta, un, cls)=>{
    const pct = Math.min(100, meta? v/meta*100 : 0);
    let k = cls||''; if(!k){ k = pct>=95 && pct<=110 ? 'ok' : (pct>110?'over':''); }
    return `<div class="meta"><div class="lb">${lb}</div>
      <div class="vl">${v}<small>/${meta}${un||''}</small></div>
      <div class="bar"><i class="${k}" style="width:${pct}%"></i></div></div>`;
  };
  document.getElementById('metas').innerHTML =
    cel('kcal', t.kcal, m.kcal, '') + cel('prot', t.p, m.p, 'g', t.p>=S.cfg.protMin?'ok':'pr') +
    cel('carb', t.c, m.cb, 'g') + cel('gord', t.g, m.g, 'g');
}

/* ---------- 9. ABA HOJE ---------- */

  let h = '';
  const al = alertas(dia);
  if(al.length) h += al.map(([tp,ic,tt,ms])=>

  /* ----- registro de dor ----- */

        <div style="font-size:12.5px;font-weight:600;color:var(--tx2);margin-top:14px">Como é a dor</div>
        <div class="chip2">${DOR_SINTOMAS.map(s=>
          `<button class="${s.alarme?'al ':''}${(dr.sint||[]).includes(s.n)?'on':''}" onclick="togDor('sint',${JSON.stringify(s.n).replace(/"/g,'&quot;')})">${esc(s.n)}</button>`).join('')}</div>
        <div class="muted" style="margin-top:7px">Os itens em vermelho são sinais neurológicos. Marcar qualquer um deles faz o app avisar para procurar atendimento sem esperar.</div>

        <div style="font-size:12.5px;font-weight:600;color:var(--tx2);margin-top:14px">Observação</div>

        <div class="muted" style="margin-top:9px">Anotar todo dia transforma "as dores aumentaram" numa curva que o especialista lê em segundos, e mostra se algum treino específico piora.</div>
      </div>
    </div></div>`;


  /* ----- medicamentos e suplementos do dia ----- */
  const dz = dosesDoDia(dia);
  if(dz.length){
    const ab = abertos.has('meds'), rs = medsResumo(dia), atr = medsAtrasadas(dia);
    h += `<div class="card"${atr.some(x=>x.atraso>=4)?' style="border-color:#5c2429"':''}>
      <div class="chead ${ab?'open':''}" onclick="toggleCard('meds')">
        <span class="hora">💊</span>
        <span class="nm">Medicamentos e suplementos</span>
        <span class="kc">${rs.feitas}/${rs.tot} tomados${atr.length?' · <b style="color:var(--wa)">'+atr.length+' em atraso</b>':''}</span>
        <span class="cv">▸</span></div>
      <div class="cbody ${ab?'open':''}">
        <div style="padding-top:8px">
        ${dz.map(x=>{
          const t = medTomado(dia,x.k), hora = medsReg(dia)[x.k];
          const late = !t && atr.some(y=>y.k===x.k);
          return `<div class="kv" style="align-items:flex-start">
            <span class="k" style="flex:1">
              <button class="btn ${t?'g':(late?'d':'')} sm" style="min-width:46px" onclick="togMed(dia,'${x.k}')">${t?'✓':'○'}</button>
              <b style="margin-left:8px;color:var(--tx)">${esc(x.m.n)}</b>
              <em style="display:block;font-size:11px;color:var(--tx3);margin-left:54px">${esc(x.m.dose||'')}${x.m.tipo==='med'?' · medicamento':' · suplemento'}</em>

        <div class="rowb" style="margin-top:10px">

    const tk = Math.round(r.itens.reduce((a,b)=>a+b.kcal*defQ(b),0)),
          tp = r.itens.reduce((a,b)=>a+b.p*defQ(b),0);
    const aberto = abertos.has(r.id);

    h += `<div class="card ${comp?'done':''}">

          return `<div class="item ${q?'on':''}">
            <div class="chk ${q?'on':''}" onclick="marcar('${key}')">✓</div>

              <div class="mac">a unidade: ${arr(it.kcal)} kcal · P ${nn(it.p)} · C ${nn(it.c)} · G ${nn(it.g)}${q?` &nbsp;→&nbsp; <b style="color:var(--tx2)">${Math.round(it.kcal*q)} kcal · P ${nn(it.p*q)}</b>`:''}</div></div>
            <div class="qtd">${q?`<select onchange="qtdPlano('${key}',this.value)">${optsQtd(q)}</select>`:''}</div>
          </div>`;
        }).join('')}
        ${ex.map(({e,i})=>`<div class="item on livre">
            <div class="chk on" style="background:var(--wa);border-color:var(--wa);color:#2d2410">+</div>
            <div class="txt">${esc(e.n)}${e.est?' <span style="font-size:10px;color:var(--tx3)">(estimado)</span>':''}
              <div class="mac">${Math.round(e.kcal*(e.q||1))} kcal · P ${nn(e.p*(e.q||1))} · C ${nn(e.c*(e.q||1))} · G ${nn(e.g*(e.q||1))}${e.dose?' · '+arr(e.dose*(e.q||1))+' dose':''}</div></div>
            <div class="qtd"><select onchange="qtdExtra(${i},this.value)">${optsQtd(e.q||1)}</select></div>
            <button class="rmv" onclick="delExtra(${i})">✕</button></div>`).join('')}
        ${(!r.itens.length && !ex.length)? '<div class="muted" style="padding:8px 0">Tudo que não se encaixa nas refeições do plano entra aqui: um doce, uma fruta fora de hora, o que se come na rua.</div>':''}
        <div class="rowb">
          ${r.itens.length?`<button class="btn g sm" onclick="marcarTudo('${r.id}',1)">Registrar tudo</button>
          <button class="btn sm" onclick="marcarTudo('${r.id}',0)">Limpar</button>`:''}
          <button class="btn p sm" onclick="sheetExtra('${r.id}')">+ item nesta refeição</button>

        </div>
      </div></div>`;
  });

  h += `<div class="card"><div class="ctr">
      <div class="lbl"><b>Água</b><span>meta ${(S.cfg.aguaMeta/1000).toFixed(1).replace('.',',')} L — a creatina pede hidratação</span></div>
      <button class="stp" onclick="agua(-250)">−</button>
      <div class="num">${(t.agua/1000).toFixed(2).replace('.',',')}<small style="font-size:11px;color:var(--tx3)"> L</small></div>
      <button class="stp" onclick="agua(250)">+</button>
    </div>
    <div style="padding:0 13px 12px"><div class="bar"><i class="${t.agua>=S.cfg.aguaMeta?'ok':''}" style="width:${Math.min(100,t.agua/S.cfg.aguaMeta*100)}%"></i></div>
    <div class="muted" style="margin-top:6px">Copos de 250 ml. O que vem do pré-treino e da vitamina já entra sozinho.</div></div></div>`;

  h += `<div class="card"><div class="pad">
      <div class="sec" style="margin-top:0">Como foi o dia</div>
      <textarea rows="2" placeholder="fome, sono, disposição, o que saiu do plano…" onchange="obsDia(this.value)">${esc(dd.obs||'')}</textarea>
    </div></div>`;

  document.getElementById('t-hoje').innerHTML = h;
}
function toggleCard(id){ if(abertos.has(id)) abertos.delete(id); else abertos.add(id); render(); }
function defQ(it){ return (it && it.q) ? it.q : 1; }
function itemDe(key){
  const p = key.split('-'), r = refeicoes().find(x=>x.id===p[0]);
  return r ? r.itens[+p[1]] : null;
}
function marcar(key){
  const dd=D(dia);
  if(dd.plano[key]) delete dd.plano[key]; else dd.plano[key]=defQ(itemDe(key));
  salvar(); render();
}
function arr(x){ return (Math.round(x*100)/100).toString().replace('.',','); }

/* opções de quantidade: passos fixos + o valor atual + "outro…" para qualquer número */
function optsQtd(q){
  q = parseFloat(q)||1;
  const passos = [0.25,0.5,0.75,1,1.25,1.5,1.75,2,2.5,3,4,5,6,7,8,9,10,12];
  if(!passos.includes(q)) passos.push(q);
  passos.sort((a,b)=>a-b);
  return passos.map(v=>`<option value="${v}" ${v===q?'selected':''}>${arr(v)}x</option>`).join('')
    + `<option value="__">outro…</option>`;
}
function qtdPlano(key,v){
  if(v==='__'){ sheetQtd('plano', key, D(dia).plano[key]||1); return; }
  D(dia).plano[key]=parseFloat(v); salvar(); render();
}
function qtdExtra(i,v){
  const e = D(dia).extras[i]; if(!e) return;
  if(v==='__'){ sheetQtd('extra', i, e.q||1); return; }
  e.q = parseFloat(v); salvar(); render();
}
function sheetQtd(tipo, ref, atual){
  abrir(`<h3>Quantidade</h3>
    <div class="sub">Qualquer número, inclusive fração. 1 significa a porção do plano; 3 significa o triplo dela.</div>
    <div class="fgrid"><div class="f1"><label>Quantas porções</label>
      <input type="number" inputmode="decimal" step="0.25" min="0.05" id="q_v" value="${atual}" autofocus></div></div>
    <div class="rowb"><button class="btn p wide" onclick="salvarQtd('${tipo}','${ref}')">Aplicar</button>
      <button class="btn wide" onclick="fechar();render()">Cancelar</button></div>`);
  setTimeout(()=>{ const el=document.getElementById('q_v'); if(el){ el.focus(); el.select(); } },60);
}
function salvarQtd(tipo, ref){
  const v = parseFloat(String((document.getElementById('q_v')||{}).value||'').replace(',','.'));
  if(!v || v<=0){ msg('Informe um número maior que zero'); return; }
  if(tipo==='plano') D(dia).plano[ref]=v;
  else { const e=D(dia).extras[parseInt(ref,10)]; if(e) e.q=v; }
  salvar(); fechar(); render(); msg('Quantidade: '+arr(v)+'x');
}
function marcarTudo(rid, on){
  const r = refeicoes().find(x=>x.id===rid), dd=D(dia);
  r.itens.forEach((it,i)=>{ const k=rid+'-'+i; if(on) dd.plano[k]=dd.plano[k]||defQ(it); else delete dd.plano[k]; });
  salvar(); render();
}
function setDor(campo, val){ const dr=dorRW(dia);
  dr[campo] = (val===null||val==='')?(campo==='n'?null:''):val;
  podarDor(dia); salvar(); render(); }
function togDor(campo, item){ const dr=dorRW(dia); const a=(dr[campo]||[]).slice();
  const i=a.indexOf(item); if(i>=0) a.splice(i,1); else a.push(item);
  dr[campo]=a; podarDor(dia); salvar(); render(); }
function limparDor(){ const dd=D(dia); delete dd.dor; salvar(); render(); msg('Dor do dia limpa'); }
function agua(ml){ const dd=D(dia); dd.agua=Math.max(0,(dd.agua||0)+ml); salvar(); render(); }
function obsDia(v){ D(dia).obs=v; salvar(); }
function delExtra(i){ D(dia).extras.splice(i,1); salvar(); render(); }

function renderTreino(){
  const tr = T(dia);

  if(tr.tipo && tr.tipo!=='off' && tr.tipo!=='run'){

    h += `<div class="lsel">${LOCAIS.map(([v,n,t])=>

function obsTreino(tr){

function resumoSemanaTreino(){
  const hj = new Date(dia+'T12:00'); let n=0, lista=[];
  for(let i=6;i>=0;i--){
    const d = new Date(hj); d.setDate(d.getDate()-i);

    <div class="sec" style="margin-top:0">Últimos 7 dias — ${n} treino(s)</div>

function setTipo(t){
  const tr=T(dia); tr.tipo = tr.tipo===t ? '' : t;
  if(tr.tipo && tr.tipo!=='off' && tr.tipo!=='run' && !tr.ex.length) carregarBib(true);
  salvar(); render();
}
function carregarBib(sil){
  const tr=T(dia), k=chaveBib(tr.tipo, localDe(dia));
  (S.bib[k]||[]).forEach(n=>{ if(!tr.ex.some(e=>e.nome===n)) tr.ex.push({nome:n, series:[serieVazia(n)]}); });
  salvar(); if(!sil){ msg('Treino '+tr.tipo+' do '+nomeLocal(localDe(dia))+' carregado'); render(); }
}
function salvarBib(){ const tr=T(dia), k=chaveBib(tr.tipo, localDe(dia));
  S.bib[k]=tr.ex.map(e=>e.nome); salvar(); msg('Salvo como '+tr.tipo+' do '+nomeLocal(localDe(dia))); }
/* Trocar de academia recarrega a lista de exercícios. Se já houver série preenchida,
   pergunta antes: o registro do dia vale mais que a comodidade de trocar. */
function setLocal(l){
  const tr=T(dia); if(tr.local===l) return;
  const temDado = (tr.ex||[]).some(e=>(e.series||[]).some(x=>x.carga||x.reps));
  if(temDado && !confirm('Já há série preenchida neste dia. Trocar para o '+nomeLocal(l)+' vai carregar os exercícios da outra academia. As séries já anotadas permanecem. Continuar?')) return;
  tr.local = l;
  if(tr.tipo && tr.tipo!=='off' && tr.tipo!=='run'){
    if(!temDado) tr.ex = [];
    carregarBib(true);
  }
  salvar(); render(); msg('Academia: '+nomeLocal(l));
}
function serieVazia(nome){ const a=ultimaCarga(nome,dia); return a? {reps:a.reps,carga:a.carga,rpe:''} : {reps:'',carga:'',rpe:''}; }
function ultimaCarga(nome, ate){
  const ds = Object.keys(S.treinos).filter(d=>d<ate).sort().reverse();
  for(const d of ds){
    const e = (S.treinos[d].ex||[]).find(x=>x.nome===nome);
    if(e && e.series.some(s=>s.carga)){
      const boas = e.series.filter(s=>s.carga);
      const top = boas.reduce((a,b)=>parseFloat(b.carga)>parseFloat(a.carga)?b:a);
      return {d, reps:top.reps, carga:top.carga, txt: boas.map(s=>`${s.reps||'?'}×${s.carga}kg`).join('  ')};
    }
  }
  return null;
}
function addSerie(i){ const e=T(dia).ex[i]; const l=e.series[e.series.length-1];
  e.series.push(l?{reps:l.reps,carga:l.carga,rpe:''}:{reps:'',carga:'',rpe:''}); salvar(); render(); }
function delSerie(i,j){ const e=T(dia).ex[i]; e.series.splice(j,1); if(!e.series.length) e.series.push({reps:'',carga:'',rpe:''}); salvar(); render(); }
function delEx(i){ T(dia).ex.splice(i,1); salvar(); render(); }
function setSerie(i,j,k,v){ T(dia).ex[i].series[j][k]= v===''?'':v; salvar(); }
function setCardio(k,v){ T(dia).cardio[k]=v; salvar(); }
function setObsTr(v){ T(dia).obs=v; salvar(); }

/* barras de dor dos últimos 30 dias, com destaque para os dias de sinal neurológico */
function graficoDor(dias){
  const N = dias||30, hj = new Date(dia+'T12:00'), pontos=[];
  for(let i=N-1;i>=0;i--){
    const dt=new Date(hj); dt.setDate(dt.getDate()-i);
    const k=dt.toLocaleDateString('sv'); const x=(S.dias[k]||{}).dor;
    pontos.push({k, n:(x&&x.n!=null)?x.n:null, al:alarmesDe(k).length>0, dia:dt.getDate()});
  }
  const comDado = pontos.filter(p=>p.n!=null);
  if(!comDado.length) return `<div class="card"><div class="pad">
    <div class="sec" style="margin-top:0">Dor — últimos ${N} dias</div>
    <div class="muted">Nenhum registro ainda. O gráfico aparece a partir do primeiro dia anotado, na aba Hoje.</div></div></div>`;
  const W=320,H=86,P=4, w=(W-2*P)/N;
  const barras = pontos.map((p,i)=>{
    const x=P+i*w;
    if(p.n==null) return `<rect x="${x+.5}" y="${H-P-2}" width="${w-1}" height="2" fill="#25375a"/>`;
    const alt=Math.max(2,(p.n/10)*(H-2*P));
    const cor = p.al ? '#f87171' : (p.n>=7?'#fb7185':(p.n>=4?'#fbbf24':'#34d399'));
    return `<rect x="${x+.5}" y="${H-P-alt}" width="${w-1}" height="${alt}" fill="${cor}" rx="1"/>`;
  }).join('');
  const media = (comDado.reduce((a,b)=>a+b.n,0)/comDado.length).toFixed(1).replace('.',',');
  const ult7 = pontos.slice(-7).filter(p=>p.n!=null);
  const m7 = ult7.length? (ult7.reduce((a,b)=>a+b.n,0)/ult7.length).toFixed(1).replace('.',',') : '—';
  const nAl = pontos.filter(p=>p.al).length;
  return `<div class="card"><div class="pad">
    <div class="sec" style="margin-top:0">Dor — últimos ${N} dias</div>
    <svg class="spark" style="height:86px" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <line x1="${P}" y1="${H-P-(7/10)*(H-2*P)}" x2="${W-P}" y2="${H-P-(7/10)*(H-2*P)}" stroke="#5c2429" stroke-width="1" stroke-dasharray="3 3"/>
      ${barras}</svg>
    <div class="legend"><span><i style="background:#34d399"></i>0 a 3</span><span><i style="background:#fbbf24"></i>4 a 6</span>
      <span><i style="background:#fb7185"></i>7 ou mais</span><span><i style="background:#f87171"></i>com sinal neurológico</span></div>
    <div class="kv" style="margin-top:9px"><span class="k">Dias registrados</span><span class="v">${comDado.length} de ${N}</span></div>
    <div class="kv"><span class="k">Média do período</span><span class="v">${media}</span></div>
    <div class="kv"><span class="k">Média dos últimos 7 dias</span><span class="v">${m7}</span></div>
    ${nAl?`<div class="kv"><span class="k">Dias com sinal neurológico</span><span class="v" style="color:var(--er)">${nAl}</span></div>`:''}
  </div></div>`;
}
function grafico(ms){
  const W=320,H=80,P=6;
  const pts = ms.filter(m=>m.peso).map(m=>({x:new Date(m.data+'T12:00').getTime(), y:parseFloat(m.peso)}));
  const pts2= ms.filter(m=>m.abdomen).map(m=>({x:new Date(m.data+'T12:00').getTime(), y:parseFloat(m.abdomen)}));
  if(pts.length<2 && pts2.length<2) return '<div class="muted">Ao menos duas medidas para desenhar a linha.</div>';
  const xs=[...pts,...pts2].map(p=>p.x), x0=Math.min(...xs), x1=Math.max(...xs)||x0+1;
  const line=(arr,minY,maxY,cor)=>{
    if(arr.length<2) return '';
    const px=p=>P+(p.x-x0)/(x1-x0||1)*(W-2*P), py=p=>H-P-(p.y-minY)/((maxY-minY)||1)*(H-2*P);
    return `<path d="${arr.map((p,i)=>`${i?'L':'M'}${px(p)},${py(p)}`).join(' ')}" fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round"/>`
      + arr.map(p=>`<circle cx="${px(p)}" cy="${py(p)}" r="2.5" fill="${cor}"/>`).join('');
  };
  const yA=pts.map(p=>p.y), yB=pts2.map(p=>p.y);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${line(pts, Math.min(...yA)-0.5, Math.max(...yA)+0.5, '#38bdf8')}
    ${line(pts2, Math.min(...yB)-1, Math.max(...yB)+1, '#fbbf24')}</svg>`;
}
function addMedida(){
  const d=document.getElementById('m_data').value||dia;
  const o={data:d, peso:val('m_peso'), cintura:val('m_cint'), abdomen:val('m_abd'), obs:document.getElementById('m_obs').value};
  if(o.peso===''&&o.cintura===''&&o.abdomen===''){ msg('Preencha ao menos um valor'); return; }
  S.medidas = S.medidas.filter(m=>m.data!==d); S.medidas.push(o);
  S.medidas.sort((a,b)=>a.data<b.data?-1:1);
  if(o.peso) S.cfg.peso=parseFloat(o.peso);
  salvar(); render(); msg('Medida registrada');
}
function val(id){ const v=document.getElementById(id).value; return v===''?'':parseFloat(String(v).replace(',','.')); }
function delMedida(d){ S.medidas=S.medidas.filter(m=>m.data!==d); salvar(); render(); }

function marcarDiaMed(v){
  const box=document.getElementById('md_dias'); if(!box) return;
  const bts=[...box.querySelectorAll('button')];
  if(v==='todos'){ bts.forEach(b=>b.classList.toggle('on', !b.dataset.d)); return; }
  bts[0].classList.remove('on');
  const b=bts.find(x=>x.dataset.d===v); if(b) b.classList.toggle('on');
  if(!bts.some(x=>x.dataset.d && x.classList.contains('on'))) bts[0].classList.add('on');
}
function salvarMed(i){
  const g=id=>(document.getElementById(id)||{}).value||'';
  const n=g('md_n').trim(); if(!n){ msg('Dê um nome ao item'); return; }
  const horas=g('md_h').split(',').map(x=>x.trim()).filter(Boolean)
    .map(x=>{ const m=/^(\d{1,2})\D?(\d{2})?$/.exec(x); if(!m) return x;
      return String(m[1]).padStart(2,'0')+':'+(m[2]||'00'); });
  const box=document.getElementById('md_dias');
  const bts=box?[...box.querySelectorAll('button')]:[];
  const todos = !bts.length || bts[0].classList.contains('on');
  const dias = todos ? 'todos' : bts.filter(b=>b.dataset.d && b.classList.contains('on')).map(b=>b.dataset.d);
  const item = {id: i>=0 ? S.meds[i].id : novoMedId(), n, dose:g('md_d').trim(),
    tipo:g('md_t')==='sup'?'sup':'med', horas: horas.length?horas:[''], dias,
    inicio:g('md_i'), fim:g('md_f'), obs:g('md_o').trim(),
    ativo: i>=0 ? (S.meds[i].ativo!==false) : true};
  S.meds = S.meds || [];
  if(i>=0) S.meds[i]=item; else S.meds.push(item);
  salvar(); fechar(); render(); msg(n+' salvo');
}
function pausarMed(i){
  const m=S.meds[i]; if(!m) return;
  m.ativo = (m.ativo===false); salvar(); render();
  msg(m.n+(m.ativo===false?' pausado':' retomado'));
}
function apagarMed(i){
  const m=S.meds[i]; if(!m) return;
  if(!confirm('Apagar "'+m.n+'" da lista? O histórico de doses já marcadas não é apagado.')) return;
  S.meds.splice(i,1); salvar(); fechar(); render(); msg('Item apagado');

let _medAvisadas = {};
function pedirNotificacao(){
  if(typeof Notification==='undefined'){ msg('Este navegador não suporta notificação'); return; }

function notificarDose(x){
  if(typeof Notification==='undefined' || Notification.permission!=='granted') return;
  const corpo = (x.m.dose? x.m.dose+' · ' : '')+'horário '+x.h;
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready)
      navigator.serviceWorker.ready.then(r=>r.showNotification('💊 '+x.m.n, {body:corpo, tag:x.k, badge:'./icon-192.png', icon:'./icon-192.png'}))
        .catch(()=>{ new Notification('💊 '+x.m.n, {body:corpo, tag:x.k}); });
    else new Notification('💊 '+x.m.n, {body:corpo, tag:x.k});
  }catch(e){}
}
function checarDoses(){
  const d = hoje();
  if(dia !== d) { /* olhando outro dia: o relógio segue valendo para hoje */ }
  medsAtrasadas(d).forEach(x=>{
    const chave = d+'|'+x.k;
    if(_medAvisadas[chave]) return;
    _medAvisadas[chave] = 1;
    notificarDose(x);
  });
  if(dia===d && aba==='hoje') render();
}

/* ---- alarme de verdade: arquivo .ics que o celular importa no calendário ---- */
function baixarIcs(){
  const meds = (S.meds||[]).filter(m=>m.ativo!==false && (m.horas||[]).some(h=>hParaNum(h)!==null));
  if(!meds.length){ msg('Nenhum item com horário para exportar'); return; }
  const z=n=>String(n).padStart(2,'0');
  const hj=new Date(), base=hj.getFullYear()+z(hj.getMonth()+1)+z(hj.getDate());
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//rod-saude//meds//PT-BR','CALSCALE:GREGORIAN'];
  meds.forEach(m=>(m.horas||[]).forEach(h=>{
    if(hParaNum(h)===null) return;
    const hh=h.replace(':','')+'00';
    const rr = Array.isArray(m.dias)
      ? 'RRULE:FREQ=WEEKLY;BYDAY='+m.dias.map(x=>['SU','MO','TU','WE','TH','FR','SA'][+x]).join(',')
      : 'RRULE:FREQ=DAILY';
    L.push('BEGIN:VEVENT',
      'UID:'+m.id+'-'+hh+'@rod-saude',
      'DTSTAMP:'+base+'T000000',
      'DTSTART:'+base+'T'+hh,
      'DURATION:PT10M',
      rr,
      'SUMMARY:💊 '+m.n+(m.dose?' — '+m.dose:''),
      m.obs?('DESCRIPTION:'+String(m.obs).replace(/\n/g,' ')):'DESCRIPTION:Registro no app rod-saude',
      'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:'+m.n,'END:VALARM',
      'END:VEVENT');
  }));
  L.push('END:VCALENDAR');
  const blob=new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'});
  baixarArq(blob, 'medicamentos - alarmes - '+ddmmaaaa(hoje())+'.ics');
  msg('Arquivo gerado. Abra-o para o celular criar os alarmes.');
}

/* A importação reconhece três formatos:
   1) pacote do aparelho  {tipo:'aparelho', perfis:{...}}
   2) pacote de um perfil {tipo:'perfil', perfil:{...}}
   3) backup da versão 1  {dias:{}, treinos:{}, ...} — entra no perfil escolhido */
function importar(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const o=JSON.parse(r.result);
      if(o && o.tipo==='aparelho' && o.perfis){
        const n=Object.keys(o.perfis).length;
        if(!confirm('Este arquivo tem '+n+' perfil(is) e SUBSTITUI todos os perfis deste aparelho. Continuar?')) return;
        DB.perfis={}; for(const id in o.perfis) DB.perfis[id]=migrar(mesclar(vazio('—'), o.perfis[id]));
        DB.atual=Object.keys(DB.perfis)[0]; S=DB.perfis[DB.atual];
        DB.disp.fixo = DB.disp.master ? DB.disp.fixo : DB.atual;
        localStorage.setItem(KEY, JSON.stringify(DB)); render(); msg(n+' perfil(is) importado(s)'); return;
      }
      const p = (o && o.tipo==='perfil' && o.perfil) ? o.perfil
              : ((o && (o.dias || o.treinos)) ? o : null);
      if(!p) throw 0;
      const nome = p.nome || 'Perfil importado';
      const alvo = Object.keys(DB.perfis).find(i=>DB.perfis[i].nome===nome);
      let destino;
      if(alvo){
        if(!confirm('Já existe o perfil "'+nome+'". Substituir os dados dele por este arquivo?')) return;
        destino = alvo;
      }else if(DB.disp.master || !Object.keys(DB.perfis).length){
        destino = novoId();
      }else{
        if(!confirm('Este arquivo é do perfil "'+nome+'", diferente de "'+S.nome+'". Substituir o perfil deste aparelho?')) return;
        destino = DB.atual;
      }
      DB.perfis[destino] = migrar(mesclar(vazio(nome), p));
      DB.perfis[destino].nome = nome;
      DB.atual = destino; S = DB.perfis[destino];

/* ---------- 14. RESUMOS PARA O CLAUDE ---------- */
function linhaMeds(d){
  const dz=dosesDoDia(d); if(!dz.length) return '';
  const r=medsResumo(d), atr=medsAtrasadas(d);
  return 'Medicamentos: '+r.feitas+'/'+r.tot+' doses marcadas'
    + (atr.length? '. Em atraso: '+atr.map(x=>x.m.n+' ('+x.h+')').join(', ') : '')
    + '. Em uso: '+medsDoDia(d).map(m=>m.n+(m.dose?' '+m.dose:'')).join('; ')+'.';
}
function historicoDor(dias){
  const N = dias||60, hj = new Date(dia+'T12:00'), L=[];
  L.push('HISTÓRICO DE DOR — últimos '+N+' dias, até '+ddmmaaaa(dia));
  if(S.contexto) L.push('Contexto: '+S.contexto);
  L.push('');
  let n=0, soma=0, alarmes=0;
  for(let i=N-1;i>=0;i--){
    const dt=new Date(hj); dt.setDate(dt.getDate()-i);
    const k=dt.toLocaleDateString('sv'); const x=(S.dias[k]||{}).dor;
    if(!x || (x.n==null && !(x.locais||[]).length && !(x.sint||[]).length)) continue;
    const tr=S.treinos[k];
    let l = ddmmaaaa(k)+' | '+(x.n!=null? x.n+'/10' : 'sem nota');
    if((x.locais||[]).length) l += ' | '+x.locais.join(', ');
    if((x.sint||[]).length) l += ' | '+x.sint.join(', ');
    if(tr&&tr.tipo) l += ' | treino '+(tr.tipo==='off'?'descanso':tr.tipo);
    if(x.obs) l += '\n   '+x.obs;
    const al=alarmesDe(k); if(al.length){ l += '\n   *** SINAL NEUROLÓGICO ***'; alarmes++; }
    L.push(l);
    if(x.n!=null){ n++; soma+=x.n; }
  }
  if(!n) L.push('(nenhum dia com intensidade registrada)');
  else {
    L.push('');
    L.push('Dias com nota: '+n+' | média '+(soma/n).toFixed(1));
    if(alarmes) L.push('Dias com sinal neurológico: '+alarmes);
  }
  return L.join('\n');
}
function resumoDia(d){
  const t=totais(d), m=metaDia(d), dd=D(d), tr=S.treinos[d];
  const L=[`DIA ${ddmmaaaa(d)} (${fds(d)?'fim de semana':'dia de semana'})`,
    `Consumido: ${t.kcal} kcal de ${m.kcal} | P ${t.p}g (alvo ${m.p}) | C ${t.c}g | G ${t.g}g | água ${(t.agua/1000).toFixed(1)}L${t.doses?' | '+t.doses+' doses de álcool':''}`];
  refeicoes().forEach(r=>{
    const marcados = r.itens.map((it,i)=>({it,q:dd.plano[r.id+'-'+i]})).filter(x=>x.q);
    const ex = extrasDe(d, r.id);
    if(!marcados.length && !ex.length) return;
    L.push(`${r.hora} ${r.nome}: ` +
      marcados.map(x=>x.it.n+(x.q!=1?' ('+x.q+'x)':'')).concat(ex.map(x=>'[fora do plano] '+x.e.n+(x.e.q>1?' x'+x.e.q:''))).join('; '));
  });
  const naoFeitas = S.plano.filter(r=>!refeicaoFeita(d,r)).map(r=>r.nome);
  if(naoFeitas.length) L.push('Não registrado: '+naoFeitas.join(', '));
  const lm = linhaMeds(d); if(lm) L.push(lm);
  if(tr&&tr.tipo){
    let l='Treino: '+(tr.tipo==='off'?'descanso':(tr.tipo==='run'?'corrida':tr.tipo+(tr.local?' ('+nomeLocal(tr.local)+')':'')));
    (tr.ex||[]).forEach(e=>{ const s=e.series.filter(x=>x.carga||x.reps); if(s.length) l+=`\n  ${e.nome}: `+s.map(x=>`${x.reps||'?'}x${x.carga||'?'}kg${x.rpe?' RPE'+x.rpe:''}`).join(', '); });
    if(tr.cardio&&tr.cardio.km) l+=`\n  corrida ${tr.cardio.km} km em ${tr.cardio.min||'?'} min`;
    if(tr.obs) l+=`\n  nota: ${tr.obs}`;
    L.push(l);
  }
  const dr = dd.dor||{};
  if(dr.n!=null || (dr.locais||[]).length || (dr.sint||[]).length || dr.obs){
    let l = 'DOR: '+(dr.n!=null? dr.n+'/10' : 'intensidade não informada');
    if((dr.locais||[]).length) l += ' | local: '+dr.locais.join(', ');
    if((dr.sint||[]).length) l += ' | '+dr.sint.join(', ');
    const al = alarmesDe(d);
    if(al.length) l += '\n  *** SINAL NEUROLÓGICO: '+al.join(', ')+' ***';
    if(dr.obs) l += '\n  nota: '+dr.obs;
    L.push(l);
  }
  if(dd.obs) L.push('Nota do dia: '+dd.obs);
  return L.join('\n');
}
function resumoSemana(){
  const hj=new Date(dia+'T12:00'); const L=['REGISTRO rod-saude — semana até '+ddmmaaaa(dia)];
  for(let i=6;i>=0;i--){
    const dt=new Date(hj); dt.setDate(dt.getDate()-i);
    const k=dt.toLocaleDateString('sv'); const t=totais(k), m=metaDia(k), tr=S.treinos[k], dd=S.dias[k];
    if(!dd&&!tr) continue;
    let l = ddmmaaaa(k)+' | '+t.kcal+' kcal (meta '+m.kcal+') | P '+t.p+'g C '+t.c+'g G '+t.g+'g | água '+(t.agua/1000).toFixed(1)+'L';
    if(t.doses) l += ' | '+t.doses+' doses';
    if(tr&&tr.tipo) l += ' | treino '+(tr.tipo==='off'?'descanso':tr.tipo);
    if(tr&&tr.cardio&&tr.cardio.km) l += ' | corrida '+tr.cardio.km+'km';
    const fora = ((dd&&dd.extras)||[]).map(e=>e.n+(e.q>1?' x'+e.q:'')).join(', ');
    if(fora) l += '\n   fora do plano: '+fora;
    const dr=(dd||{}).dor||{};
    if(dr.n!=null) l += ' | dor '+dr.n+'/10'+((dr.locais||[]).length?' ('+dr.locais.join(', ')+')':'');
    const alr=alarmesDe(k);
    if(alr.length) l += '\n   *** SINAL NEUROLÓGICO: '+alr.join(', ')+' ***';
    if(dr.obs) l += '\n   dor: '+dr.obs;
    if(dd&&dd.obs) l += '\n   nota: '+dd.obs;
    L.push(l);
  }
  const ult=S.medidas[S.medidas.length-1];
  if(ult) L.push('Última medida: '+ddmmaaaa(ult.data)+' — '+(ult.peso?ult.peso+'kg ':'')+(ult.cintura?'cintura '+ult.cintura+' ':'')+(ult.abdomen?'abdômen '+ult.abdomen:''));
  return L.join('\n');
}
function copiarResumo(){ copiar(resumoSemana()); }
function copiar(txt){
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(()=>msg('Copiado'),()=>fb(txt));
  else fb(txt);
  function fb(t){ const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0';
    document.body.appendChild(a); a.select();
    try{document.execCommand('copy'); msg('Copiado');}catch(e){msg('Não foi possível copiar');} a.remove(); }
}

/* aplica a resposta do Claude: linhas #RS ou JSON de atualização */
function aplicarClaude(){
  const txt = (document.getElementById('cl_in')||{}).value || '';
  if(!txt.trim()){ msg('Cole a resposta do Claude'); return; }
  let n = aplicarLinhasRS(txt);
  let j = aplicarJSON(txt);
  if(!n && !j){ msg('Não reconheci nada no texto colado'); return; }
  salvar(); fechar(); render();
  msg((n?n+' alimento(s) lançado(s). ':'') + (j?'Plano atualizado.':''));
}
function aplicarLinhasRS(txt){
  const dd = D(dia); let n=0;
  txt.split(/\r?\n/).forEach(l=>{
    l = l.replace(/^\s*[`>*-]*\s*/,'').trim();
    if(!/^#RS\b/i.test(l)) return;
    const p = l.replace(/^#RS\d*\s*\|?\s*/i,'').split('|').map(x=>x.trim());
    if(p.length < 6) return;
    let ref = (p[0].match(/r[1-8]/i)||['r8'])[0].toLowerCase();
    const num = s => { const v=parseFloat(String(s).replace(',','.').replace(/[^0-9.\-]/g,'')); return isNaN(v)?0:v; };
    dd.extras.push({ref, n:p[1], kcal:num(p[2]), p:num(p[3]), c:num(p[4]), g:num(p[5]), q:1, est:true});
    abertos.add(ref); n++;
  });
  return n;
}
function aplicarJSON(txt){
  const m = txt.match(/\{[\s\S]*\}/);
  if(!m) return 0;
  let o; try{ o = JSON.parse(m[0]); }catch(e){ return 0; }
  let mudou = 0;
  if(Array.isArray(o.plano) && o.plano.length){ S.plano=o.plano; mudou++; }
  if(Array.isArray(o.labs) && o.labs.length){ S.labs=o.labs; mudou++; }
  if(Array.isArray(o.estrutural) && o.estrutural.length){ S.estrutural=o.estrutural; mudou++; }
  if(Array.isArray(o.perguntas) && o.perguntas.length){ S.perguntas=o.perguntas; mudou++; }
  if(o.cfg && typeof o.cfg==='object'){ Object.assign(S.cfg, o.cfg); mudou++; }
  if(Array.isArray(o.meds) && o.meds.length){ S.meds=o.meds; mudou++; }
  if(Array.isArray(o.prazos) && o.prazos.length){ S.prazos=o.prazos; mudou++; }
  if(Array.isArray(o.cuidados) && o.cuidados.length){ S.cuidados=o.cuidados; mudou++; }
  if(o.rot && typeof o.rot==='object'){ Object.assign(S.rot, o.rot); mudou++; }
  if(o.notas && typeof o.notas==='object'){ Object.assign(S.notas, o.notas); mudou++; }
  if(o.destaque !== undefined){ S.destaque=o.destaque; mudou++; }
  if(typeof o.contexto==='string'){ S.contexto=o.contexto; mudou++; }
  if(typeof o.base==='string'){ S.base=o.base; mudou++; }
  if(o.exames && typeof o.exames==='object'){
    (S.prazos||[]).forEach(p=>{ if(o.exames[p.k]!==undefined) p.d=o.exames[p.k]; }); mudou++; }
  if(o.bib && typeof o.bib==='object'){ Object.assign(S.bib, o.bib); mudou++; }
  if(mudou){ S.atualizacoes = S.atualizacoes||[]; S.atualizacoes.push({d:hoje(), chaves:Object.keys(o)}); }
  return mudou;
}

  const ja = dd.extras.find(x=>x.n===e.n && (x.ref||'r8')===rid);
  if(ja) ja.q=(ja.q||1)+1; else dd.extras.push(Object.assign({}, e, {q:1, ref:rid}));
  abertos.add(rid); salvar(); render(); msg(e.n+' adicionado');
}
function addExtraMao(rid){
  const n=document.getElementById('e_n').value.trim();
  if(!n){ msg('Dê um nome ao item'); return; }
  const g=id=>+document.getElementById(id).value||0;
  D(dia).extras.push({n, kcal:g('e_k'), p:g('e_p'), c:g('e_c'), g:g('e_g'), q:1, ref:rid});
  abertos.add(rid); salvar(); fechar(); render();
}
/* Escolher exercício de QUALQUER treino, de qualquer academia.
   A lista vem agrupada por treino e prédio, com busca, e o que já está no dia aparece marcado. */
function sheetEx(){
  abrir(`<h3>Adicionar exercício</h3>
    <div class="sub">Pode pegar exercício de qualquer treino e de qualquer academia. O histórico de carga acompanha o NOME, então o "última vez" continua valendo mesmo mudando de letra.</div>
    <div class="fgrid"><div class="f1"><label>Buscar</label>
      <input id="x_busca" placeholder="ex.: remada, agachamento, prancha" oninput="pintarEx()"></div></div>
    <div id="x_lista"></div>
    <div class="sec">Ou crie um exercício novo</div>
    <div class="fgrid"><div class="f1"><label>Nome</label><input id="x_n" placeholder="ex.: remada cavalinho"></div></div>
    <div class="rowb"><button class="btn p" onclick="addEx(document.getElementById('x_n').value)">Adicionar</button>
    <button class="btn" onclick="fechar()">Fechar</button></div>`);
  pintarEx();
}
function grupoEx(){
  /* Ordem estável: cada letra, e dentro dela cada academia. Depois, o que existe no
     aparelho e não está em nenhuma biblioteca da semente (exercício criado por você). */
  const gs=[], vistos=new Set();
  for(const t in TREINO_SEED) for(const [l,nm] of LOCAIS){
    const k=chaveBib(t,l), lista=(S.bib[k]||[]);
    if(!lista.length) continue;
    lista.forEach(n=>vistos.add(n));
    gs.push({k, rot:(rotDe(t,l)||t+' — '+nm), ex:lista.slice()});
  }
  const soltos=[];
  Object.keys(S.treinos||{}).forEach(d=>((S.treinos[d].ex)||[]).forEach(e=>{
    if(!vistos.has(e.nome) && !soltos.includes(e.nome)) soltos.push(e.nome); }));
  if(soltos.length) gs.push({k:'__hist', rot:'Já usados por você, fora das bibliotecas', ex:soltos.sort()});
  return gs;
}
function pintarEx(){
  const el=document.getElementById('x_lista'); if(!el) return;
  const f=na((document.getElementById('x_busca')||{}).value||'');
  const tr=T(dia), jaTem=n=>tr.ex.some(e=>e.nome===n);
  let h='', achou=0;
  grupoEx().forEach(g=>{
    const ex=g.ex.filter(n=>!f || na(n).includes(f));
    if(!ex.length) return;
    achou+=ex.length;
    const faltam=ex.filter(n=>!jaTem(n));
    h+=`<div class="sec" style="display:flex;align-items:center;gap:8px">
        <span style="flex:1">${esc(g.rot)}</span>
        ${faltam.length>1?`<button class="btn sm" onclick="addVarios(${JSON.stringify(faltam).replace(/"/g,'&quot;')})">+ todos (${faltam.length})</button>`:''}
      </div>
      <div class="chips">${ex.map(n=>{
        const t=jaTem(n);
        return `<button class="chip ${t?'al':''}" ${t?'disabled style="opacity:.45"':''}
          onclick="addEx(${JSON.stringify(n).replace(/"/g,'&quot;')},1)">${t?'✓ ':''}${esc(n)}</button>`;
      }).join('')}</div>`;
  });
  el.innerHTML = achou ? h : '<div class="muted" style="padding:6px 0">Nada com esse nome. Use o campo abaixo para criar.</div>';
}
function na(s){ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function addVarios(nomes){
  const tr=T(dia); let n=0;
  (nomes||[]).forEach(x=>{ if(!tr.ex.some(e=>e.nome===x)){ tr.ex.push({nome:x, series:[serieVazia(x)]}); n++; } });
  salvar(); pintarEx(); render(); msg(n+' exercício(s) adicionado(s)');
}
/* manter=1 deixa a folha aberta, para escolher vários seguidos sem reabrir */
function addEx(nome, manter){
  nome=(nome||'').trim(); if(!nome){ msg('Informe o nome'); return; }
  const tr=T(dia);
  if(tr.ex.some(e=>e.nome===nome)){ msg('Já está no treino de hoje'); return; }
  tr.ex.push({nome, series:[serieVazia(nome)]}); salvar();
  if(manter){ pintarEx(); const c=document.getElementById('x_n'); if(c) c.value=''; render(); msg(nome+' adicionado'); }
  else { fechar(); render(); }
}
function irHoje(){ if(dia===hoje()) return; dia=hoje(); render(); window.scrollTo(0,0); msg('Voltou para hoje'); }
function sheetCfg(){
  const c=S.cfg;
  abrir(`<h3>Ajustar metas</h3>
    <div class="fgrid">
      <div><label>kcal seg-sex</label><input type="number" id="c_ks" value="${c.kcalSem}"></div>
      <div><label>kcal sáb-dom</label><input type="number" id="c_kf" value="${c.kcalFds}"></div>
      <div><label>Proteína alvo (g)</label><input type="number" id="c_pm" value="${c.protMeta}"></div>
      <div><label>Proteína mínima (g)</label><input type="number" id="c_pn" value="${c.protMin}"></div>
      <div><label>Carboidrato (g)</label><input type="number" id="c_cb" value="${c.carbMeta}"></div>
      <div><label>Gordura (g)</label><input type="number" id="c_gd" value="${c.gordMeta}"></div>
      <div><label>Água (ml)</label><input type="number" id="c_ag" value="${c.aguaMeta}"></div>
      <div><label>Teto de doses</label><input type="number" id="c_ds" value="${c.dosesMax}"></div>
      <div class="f1"><label>Dia da pesagem</label><select id="c_dp">${['domingo','segunda','terça','quarta','quinta','sexta','sábado'].map((n,i)=>`<option value="${i}" ${i==c.diaPeso?'selected':''}>${n}</option>`).join('')}</select></div>
    </div>
    <div class="rowb"><button class="btn p" onclick="salvarCfg()">Salvar</button><button class="btn" onclick="fechar()">Cancelar</button></div>`);
}
function salvarCfg(){
  const g=id=>+document.getElementById(id).value;
  Object.assign(S.cfg,{kcalSem:g('c_ks'),kcalFds:g('c_kf'),protMeta:g('c_pm'),protMin:g('c_pn'),
    carbMeta:g('c_cb'),gordMeta:g('c_gd'),aguaMeta:g('c_ag'),dosesMax:g('c_ds'),diaPeso:g('c_dp')});
  salvar(); fechar(); render(); msg('Metas atualizadas');
}
let tmo; function msg(t){ const e=document.getElementById('toast'); e.textContent=t; e.classList.add('on');
  clearTimeout(tmo); tmo=setTimeout(()=>e.classList.remove('on'),2200); }

/* ---------- 17b. PERFIL: barra do topo e primeiro uso ---------- */
function renderPerfilBar(){
  const el = document.getElementById('pbar');
  const ids = Object.keys(DB.perfis);
  if(!DB.disp.master){
    el.innerHTML = `<span class="pnome">${esc(S.nome)}</span><span>· aparelho fixo neste perfil</span>`;
    return;
  }
  el.innerHTML = `<span class="tagm">MASTER</span>` + (ids.length>1
    ? `<select onchange="trocarPerfil(this.value)">${ids.map(i=>
        `<option value="${i}" ${i===DB.atual?'selected':''}>${esc(DB.perfis[i].nome)}</option>`).join('')}</select>`
    : `<span class="pnome">${esc(S.nome)}</span>`)
    + `<span class="qt">· ${ids.length} perfil(is)</span>`;
}
function precisaOnboarding(){ return !Object.keys(DB.perfis).length || !DB.atual; }
function renderOnb(){
  const el = document.getElementById('onb');
  if(!precisaOnboarding()){ el.classList.remove('on'); return; }
  el.classList.add('on');
  el.innerHTML = `<h2>De quem é este aparelho?</h2>
    <div class="sub">Cada pessoa é um perfil separado. O aparelho fica preso ao perfil escolhido aqui — é o que evita marcar a refeição de uma pessoa no registro de outra. Só o aparelho master troca de perfil livremente.</div>
    <div class="pcard">
      <b>Perfil novo, em branco</b>
      <div class="muted" style="margin:6px 0 10px">Nasce sem cardápio, sem exames e sem treino. O conteúdo é montado com o Claude e entra por importação.</div>
      <div class="fgrid"><div class="f1"><label>Nome da pessoa</label>
        <input id="onb_nome" placeholder="ex.: Maria"></div></div>
      <div class="rowb" style="margin-top:10px"><button class="btn p wide" onclick="onbCriar(false)">Criar perfil em branco</button></div>
    </div>
    <div class="pcard">
      <b>Perfil do Rodolfo (semente completa)</b>
      <div class="muted" style="margin:6px 0 10px">Traz o cardápio de 3.053 kcal, os exames, os achados de coluna e o programa ABCDE. Use só no aparelho dele.</div>
      <div class="rowb"><button class="btn wide" onclick="onbCriar(true)">Criar com a semente do Rodolfo</button></div>
    </div>
    <div class="pcard">
      <b>Já tenho o arquivo</b>
      <div class="muted" style="margin:6px 0 10px">Importe um perfil exportado por outro aparelho, ou um backup da versão 1.</div>
      <div class="rowb"><button class="btn wide" onclick="document.getElementById('onb_imp').click()">Importar arquivo</button></div>
      <input type="file" id="onb_imp" accept=".json" style="display:none" onchange="importar(this)">
    </div>`;
}
function onbCriar(semente){
  const el = document.getElementById('onb_nome');
  const nome = semente ? ((el&&el.value.trim())||'Rodolfo') : ((el&&el.value.trim())||'');
  if(!semente && !nome){ msg('Escreva o nome da pessoa'); return; }
  const id = criarPerfil(nome, semente);
  DB.disp.fixo = id; DB.disp.master = semente;
  localStorage.setItem(KEY, JSON.stringify(DB));
  render();
  msg(semente ? 'Perfil criado. Este aparelho ficou como MASTER.' : 'Perfil "'+nome+'" criado');
}

/* ---------- 18. NAVEGAÇÃO ---------- */
const ABAS=[['hoje','🍽️','Hoje'],['treino','🏋️','Treino'],['medidas','📏','Medidas'],['saude','🩺','Saúde'],['dados','💾','Dados']];
document.getElementById('nav').innerHTML = ABAS.map(([k,i,n])=>
  `<button id="n-${k}" onclick="irPara('${k}')"><span class="i">${i}</span>${n}</button>`).join('')
  + `<button id="n-claude" onclick="sheetClaude()"><span class="i">✦</span>Claude</button>`;
function irPara(k){ aba=k; render(); window.scrollTo(0,0); }
function mvDia(n){ const d=new Date(dia+'T12:00'); d.setDate(d.getDate()+n); dia=d.toLocaleDateString('sv'); render(); window.scrollTo(0,0); }

function render(){
  const y = window.scrollY;                 /* preserva a posição da rolagem */
  renderOnb();
  if(precisaOnboarding()) return;
  renderPerfilBar();
  renderTopo();
  ABAS.forEach(([k])=>{
    document.getElementById('t-'+k).classList.toggle('on', k===aba);
    document.getElementById('n-'+k).classList.toggle('on', k===aba);
  });
  document.getElementById('ttl').textContent = {hoje:'Alimentação',treino:'Treino',medidas:'Medidas',saude:'Histórico médico',dados:'Dados'}[aba];
  ({hoje:renderHoje, treino:renderTreino, medidas:renderMedidas, saude:renderSaude, dados:renderDados})[aba]();
  window.scrollTo(0, y);
}
render();

document.addEventListener('visibilitychange',()=>{ if(!document.hidden && dia!==hoje() && aba==='hoje'){ dia=hoje(); render(); } });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
