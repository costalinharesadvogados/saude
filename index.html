<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>rod-saude — registro diário</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0b1220; --bg2:#111c31; --card:#16233c; --card2:#1c2c49; --line:#25375a;
  --tx:#e8eefb; --tx2:#9fb0cd; --tx3:#6c7f9f;
  --ac:#38bdf8; --ok:#34d399; --wa:#fbbf24; --er:#f87171; --pr:#a78bfa; --cl:#d97757;
  --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(74px + var(--safe));
}
h1,h2,h3{margin:0;font-weight:650}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
input[type=number]{-moz-appearance:textfield}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

header{position:sticky;top:0;z-index:40;background:rgba(11,18,32,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 14px 8px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:16px;letter-spacing:.2px;flex:1}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{padding:4px 9px;border-radius:8px;background:var(--card);font-size:15px;color:var(--tx2)}
.datenav .d{font-size:13px;font-weight:600;min-width:104px;text-align:center;color:var(--tx)}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--tx2);white-space:nowrap}
.badge.fds{background:#3a2a12;color:#fbbf24}

.metas{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.meta{background:var(--card);border-radius:10px;padding:6px 7px}
.meta .lb{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px}
.meta .vl{font-size:14px;font-weight:700;line-height:1.2;margin-top:1px}
.meta .vl small{font-size:10px;font-weight:500;color:var(--tx3)}
.bar{height:4px;border-radius:2px;background:#0a1526;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--ac);transition:width .25s}
.bar i.ok{background:var(--ok)} .bar i.over{background:var(--er)} .bar i.pr{background:var(--pr)}

main{padding:12px 14px 20px;max-width:760px;margin:0 auto}
.tab{display:none} .tab.on{display:block}

.card{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:11px;overflow:hidden}
.chead{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;user-select:none}
.chead .hora{font-size:11px;font-weight:700;color:var(--ac);background:#0d2436;padding:2px 7px;border-radius:6px;letter-spacing:.3px;white-space:nowrap}
.chead .nm{flex:1;font-weight:600;font-size:14px}
.chead .kc{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums;text-align:right}
.chead .cv{font-size:12px;color:var(--tx3);transition:transform .2s}
.chead.open .cv{transform:rotate(90deg)}
.cbody{display:none;padding:0 13px 12px;border-top:1px solid var(--line)}
.cbody.open{display:block}
.card.done .chead .nm{color:var(--ok)}
.card.done{border-color:#1f5741}

.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(37,55,90,.5)}
.item:last-child{border-bottom:none}
.chk{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:transparent;background:var(--bg2)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06281c}
.item .txt{flex:1;font-size:13px;line-height:1.35}
.item .mac{font-size:10.5px;color:var(--tx3);margin-top:2px;font-variant-numeric:tabular-nums}
.item.on .txt{color:var(--tx)}
.item:not(.on) .txt{color:var(--tx2)}
.item.livre .txt{color:var(--wa)}
.qtd{width:58px;flex:none}
.qtd select{padding:5px 4px;font-size:12px;text-align:center}
.rmv{color:var(--er);font-size:17px;padding:2px 6px;flex:none;opacity:.75;background:none}

.rowb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{background:var(--card2);border:1px solid var(--line);padding:9px 13px;border-radius:10px;font-size:13px;font-weight:600}
.btn.p{background:var(--ac);color:#052539;border-color:var(--ac)}
.btn.g{background:#123528;color:var(--ok);border-color:#1f5741}
.btn.d{background:#33161a;color:var(--er);border-color:#5c2429}
.btn.c{background:var(--cl);color:#2a0f06;border-color:var(--cl)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:active{transform:scale(.97)}
.btn.wide{width:100%;justify-content:center;text-align:center}

.ctr{display:flex;align-items:center;gap:12px;padding:11px 13px}
.ctr .lbl{flex:1}
.ctr .lbl b{display:block;font-size:14px}
.ctr .lbl span{font-size:11.5px;color:var(--tx3)}
.ctr .num{font-size:19px;font-weight:700;min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.stp{width:38px;height:38px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-size:19px;font-weight:700;display:grid;place-items:center;flex:none}

.alert{display:flex;gap:9px;padding:10px 12px;border-radius:11px;margin-bottom:8px;font-size:12.5px;line-height:1.45;border:1px solid}
.alert .ic{font-size:14px;line-height:1.2;flex:none}
.alert b{display:block;margin-bottom:1px;font-size:13px}
.a-info{background:#0d2436;border-color:#1a4460;color:#bfe4f8}
.a-warn{background:#2d2410;border-color:#5c4a19;color:#fde5b0}
.a-good{background:#0f2b20;border-color:#1f5741;color:#bdf0d9}
.a-crit{background:#331418;border-color:#5c2429;color:#fbc9c9}

.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(37,55,90,.5);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--tx2)} .kv .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.kv .v em{font-style:normal;font-size:10.5px;color:var(--tx3);display:block;font-weight:400}
.v.hi{color:var(--wa)} .v.lo{color:var(--ac)} .v.gd{color:var(--ok)}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);margin:16px 0 7px;font-weight:700}
.pad{padding:11px 13px}
.muted{color:var(--tx3);font-size:12px;line-height:1.5}

.tsel{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:11px}
.tsel button{padding:11px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--tx2)}
.tsel button.on{background:var(--ac);color:#052539;border-color:var(--ac)}
.tsel button.rest.on{background:var(--tx3);color:#0b1220;border-color:var(--tx3)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
.exh{display:flex;align-items:center;gap:9px;padding:10px 12px}
.exh .n{flex:1;font-weight:600;font-size:13.5px}
.serie{display:grid;grid-template-columns:26px 1fr 1fr 1fr 30px;gap:6px;align-items:center;padding:5px 12px}
.serie .ix{font-size:11px;color:var(--tx3);font-weight:700;text-align:center}
.serie input{padding:7px 5px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.shead{display:grid;grid-template-columns:26px 1fr 1fr 1fr 30px;gap:6px;padding:2px 12px 3px}
.shead span{font-size:9.5px;color:var(--tx3);text-align:center;text-transform:uppercase;letter-spacing:.5px}
.prev{font-size:10.5px;color:var(--tx3);padding:1px 12px 7px;font-variant-numeric:tabular-nums}

svg.spark{width:100%;height:80px;display:block}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--tx3);margin-top:5px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(17,28,49,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe)}
nav button{padding:9px 0 8px;display:grid;justify-items:center;gap:2px;color:var(--tx3);font-size:10px;font-weight:600}
nav button .i{font-size:19px;line-height:1}
nav button.on{color:var(--ac)}

.fab{position:fixed;right:14px;bottom:calc(84px + var(--safe));z-index:45;width:54px;height:54px;border-radius:17px;
  background:var(--cl);color:#2a0f06;font-size:12px;font-weight:800;display:grid;place-items:center;
  box-shadow:0 6px 20px rgba(0,0,0,.45);line-height:1.05;text-align:center}

.mask{position:fixed;inset:0;background:rgba(3,7,15,.75);z-index:60;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px 15px calc(20px + var(--safe))}
.sheet h3{font-size:15px;margin-bottom:4px}
.sheet .sub{font-size:12px;color:var(--tx3);margin-bottom:12px;line-height:1.45}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.fgrid label{font-size:11px;color:var(--tx3);display:block;margin-bottom:3px}
.f1{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;max-height:186px;overflow:auto}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:12px;color:var(--tx2)}
.chip.al{border-color:#5c4a19;color:#fbbf24}
.foto{width:100%;border-radius:11px;margin-bottom:10px;display:block;max-height:190px;object-fit:cover}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + var(--safe));background:var(--ok);color:#06281c;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
code{background:#0a1526;padding:1px 5px;border-radius:5px;font-size:11.5px;color:var(--ac)}
pre{background:#0a1526;padding:10px;border-radius:9px;font-size:11px;overflow:auto;color:var(--tx2);margin:0 0 10px}
</style>
</head>

  <div class="hrow">
    <h1 id="ttl">Hoje</h1>

    <div class="datenav">
      <button onclick="mvDia(-1)">‹</button>
      <span class="d" id="dlbl">—</span>
      <button onclick="mvDia(1)">›</button>
    </div>
  </div>
  <div class="metas" id="metas"></div>
</header>

<main>
  <section class="tab on" id="t-hoje"></section>

</main>

<nav id="nav"></nav>

<div class="mask" id="mask" onclick="if(event.target===this)fechar()">

</div>

/* ---------- 5. ESTADO ---------- */
const KEY='rodsaude_v1';
function base(){
  const b = {
    v:2,
    cfg:{peso:91, aguaMeta:3500, kcalSem:3054, kcalFds:3400, protMeta:203, carbMeta:359, gordMeta:99,
         protMin:180, dosesMax:5, diaPeso:1},
    exames:{cistatina:'', lipidico:'2026-11-26', avalFisica:'2026-10-15'},
    plano: JSON.parse(JSON.stringify(PLANO_PADRAO)),
    labs: JSON.parse(JSON.stringify(LABS_PADRAO)),
    estrutural: JSON.parse(JSON.stringify(ESTRUTURAL_PADRAO)),
    perguntas: PERGUNTAS_PADRAO.slice(),
    dias:{}, treinos:{}, bib:{}, medidas:[], atualizacoes:[]
  };
  for(const k in TREINO_SEED) b.bib[k] = TREINO_SEED[k].ex.slice();
  return b;
}
let S = carregar();
let dia = hoje();
let aba = 'hoje';
let abertos = new Set(['r8']);          /* cartões abertos — corrige o fechamento ao marcar item */
let fotoPendente = null;                 /* File da foto aguardando envio */

function hoje(){ return new Date().toLocaleDateString('sv'); }
function carregar(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY));
    return r ? migrar(mesclar(base(), r)) : base();
  }catch(e){ return base(); }
}
function mesclar(b, n){
  const o = Object.assign({}, b, n);
  o.cfg = Object.assign({}, b.cfg, n.cfg||{});
  o.exames = Object.assign({}, b.exames, n.exames||{});
  o.bib = Object.assign({}, b.bib, n.bib||{});
  o.plano = n.plano && n.plano.length ? n.plano : b.plano;
  o.labs = n.labs && n.labs.length ? n.labs : b.labs;
  o.estrutural = n.estrutural && n.estrutural.length ? n.estrutural : b.estrutural;
  o.perguntas = n.perguntas && n.perguntas.length ? n.perguntas : b.perguntas;
  o.atualizacoes = n.atualizacoes || b.atualizacoes || [];
  return o;
}
function migrar(o){
  /* v1 -> v2: extras sem refeição passam a pertencer à 8ª refeição */
  Object.values(o.dias||{}).forEach(d=>{ (d.extras||[]).forEach(e=>{ if(!e.ref) e.ref='r8'; }); });
  o.v = 2; return o;
}
function salvar(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ msg('Falha ao salvar'); } }
function refeicoes(){ return S.plano.concat([REF_EXTRA]); }
function D(d){ if(!S.dias[d]) S.dias[d]={plano:{},extras:[],agua:0,obs:''}; return S.dias[d]; }
function T(d){ if(!S.treinos[d]) S.treinos[d]={tipo:'',ex:[],cardio:{km:'',min:'',pse:''},obs:''}; return S.treinos[d]; }

/* ---------- 6. CÁLCULOS ---------- */
function fds(d){ const w = new Date(d+'T12:00').getDay(); return w===0||w===6; }
function metaDia(d){
  const f = fds(d), c = S.cfg;
  return f ? {kcal:c.kcalFds, p:c.protMeta, cb:Math.round(c.carbMeta*1.1), g:Math.round(c.gordMeta*1.1)}
           : {kcal:c.kcalSem, p:c.protMeta, cb:c.carbMeta, g:c.gordMeta};
}
function totais(d){
  const dd = D(d); let t={kcal:0,p:0,c:0,g:0,sat:0,doses:0,agua:dd.agua||0,itens:0};
  S.plano.forEach(r=>r.itens.forEach((it,i)=>{
    const q = dd.plano[r.id+'-'+i];
    if(q){ t.kcal+=it.kcal*q; t.p+=it.p*q; t.c+=it.c*q; t.g+=it.g*q; t.itens++;
           if(it.agua) t.agua += it.agua*q; }
  }));
  (dd.extras||[]).forEach(e=>{
    const q = e.q||1;
    t.kcal+=e.kcal*q; t.p+=e.p*q; t.c+=e.c*q; t.g+=e.g*q; t.itens++;
    if(e.sat) t.sat += e.g*q;
    if(e.dose) t.doses += e.dose*q;
    if(e.agua) t.agua += e.agua*q;
  });
  ['kcal','p','c','g','sat','agua'].forEach(k=>t[k]=Math.round(t[k]));
  t.doses = Math.round(t.doses*10)/10;
  return t;
}
function extrasDe(d, rid){ return (D(d).extras||[]).map((e,i)=>({e,i})).filter(x=>(x.e.ref||'r8')===rid); }
function refeicaoFeita(d, r){
  const dd=D(d);
  return r.itens.some((it,i)=>dd.plano[r.id+'-'+i]) || extrasDe(d, r.id).length>0;
}
function refeicaoCompleta(d, r){
  if(!r.itens.length) return false;
  const dd=D(d); return r.itens.every((it,i)=>dd.plano[r.id+'-'+i]);
}
function difDias(a,b){ return Math.round((new Date(b+'T12:00') - new Date(a+'T12:00'))/86400000); }
function fmtData(d){
  const dt=new Date(d+'T12:00');
  const sem=['dom','seg','ter','qua','qui','sex','sáb'][dt.getDay()];
  return sem+' '+String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0');
}
function ddmmaaaa(d){ if(!d) return '—'; const p=d.split('-'); return p[2]+p[1]+p[0]; }
function isoOf(dd){ return dd.slice(4)+'-'+dd.slice(2,4)+'-'+dd.slice(0,2); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nn(x){ return (Math.round(x*10)/10).toString().replace('.',',')+'g'; }

/* ---------- 7. MOTOR DE ALERTAS ---------- */
function alertas(d){
  const t = totais(d), m = metaDia(d), dd = D(d), c = S.cfg, a = [];
  const ehHoje = d === hoje();
  const hora = ehHoje ? new Date().getHours()+new Date().getMinutes()/60 : 23.9;
  const f = fds(d);

  if(t.doses > 0){
    if(t.doses > c.dosesMax)
      a.push(['crit','🍺','Acima do combinado: '+t.doses+' doses',
        'O plano fixou 5 doses por dia de fim de semana. Cada dose além disso repõe o excedente que travou o peso em 91 kg por um ano — e o álcool deposita preferencialmente na região abdominal, justamente a dobra que subiu de 26 para 30 mm.']);
    else if(t.doses >= 4)
      a.push(['warn','🍺', t.doses+' doses — atenção ao teto',
        'O teto do plano é 5. Alterne cada dose com um copo de água: a hidratação importa por causa da creatina.']);
    else
      a.push(['info','🍺', t.doses+' dose(s) registrada(s)',
        'Anotar as doses é a variável que decide o resultado. Coma proteína antes de beber.']);
  }
  if(hora >= 20 || t.itens >= 20){
    if(t.p < c.protMin)
      a.push(['warn','🥩','Proteína em '+t.p+' g — abaixo do alvo',
        'O alvo é '+c.protMeta+' g ('+(c.protMeta/c.peso).toFixed(2).replace('.',',')+' g/kg). Em déficit calórico com treino de força, a proteína é o que protege a massa magra. Uma opção rápida: iogurte grego, atum ou ovos.']);
    else
      a.push(['good','🥩','Proteína em '+t.p+' g — alvo cumprido','']);
  }
  if(hora >= 21 && !refeicaoFeita(d, S.plano[6]))
    a.push(['warn','🍽️','O jantar não foi registrado',
      'O jantar das 19h30 é a mudança central deste plano. Sem ele, voltam as ~9 horas só com líquido antes de dormir — o padrão que coincide com a alta da dobra abdominal entre abril e julho.']);
  if(t.sat >= 30)
    a.push(['warn','🧀','Carga alta de gordura saturada hoje (~'+t.sat+' g em itens saturados)',
      'Seu colesterol total está no limite ou acima na maioria das coletas desde 2013 e o LDL chegou a 145 em 10/2024. O perfil lipídico é o seu principal alvo dietético.']);
  if(t.agua > 0){
    const pct = t.agua / c.aguaMeta;
    if(hora >= 18 && pct < 0.7)
      a.push(['warn','💧','Hidratação em '+(t.agua/1000).toFixed(1).replace('.',',')+' L de '+(c.aguaMeta/1000).toFixed(1).replace('.',',')+' L',
        'Você toma 7 g de creatina por dia. Hidratação adequada é um dos fatores de proteção renal com maior respaldo, e pesa na leitura da sua creatinina.']);
    else if(pct >= 1)
      a.push(['good','💧','Meta de água cumprida','']);
  }
  if(t.kcal > m.kcal * 1.15)
    a.push(['warn','🔥','Calorias em '+t.kcal+' — acima da meta de '+m.kcal,
      'Um dia acima não desfaz a semana. O que desfaz é a soma de sábado e domingo.']);
  else if(t.kcal >= m.kcal*0.9 && t.kcal <= m.kcal*1.05 && t.itens>10)
    a.push(['good','🎯','Dia dentro da meta calórica','']);
  if(f && t.itens===0)
    a.push(['info','📅','Fim de semana: meta de '+m.kcal+' kcal e teto de '+c.dosesMax+' doses',
      'Os dois dias do fim de semana somavam ~5.940 kcal extras — o dobro do que toda a semana de treino queima. É aqui que o resultado é decidido.']);

  const dt = new Date(d+'T12:00');
  if(ehHoje && dt.getDay() === c.diaPeso){
    const ultima = S.medidas.length ? S.medidas[S.medidas.length-1] : null;
    if(!ultima || difDias(ultima.data, d) >= 6)
      a.push(['info','⚖️','Hoje é dia de pesagem',
        'Em jejum, antes do treino, mesmo dia da semana. Registre na aba Medidas. Não pese diariamente.']);
  }
  if(!S.exames.cistatina)
    a.push(['crit','🔬','Cistatina C ainda pendente',
      'É a maior prioridade da próxima consulta. Sua TFGe de 75-76 pode ser artefato de massa muscular, treino e creatina — a cistatina C separa efeito de músculo de efeito de rim. Peça junto a relação albumina/creatinina urinária.']);
  ['lipidico','avalFisica'].forEach(k=>{
    const dta = S.exames[k]; if(!dta) return;
    const dias = difDias(d, dta);
    const nome = k==='lipidico' ? 'Reavaliação do perfil lipídico' : 'Próxima avaliação física';
    if(dias <= 30 && dias >= 0)
      a.push([dias<=7?'warn':'info','📆', nome+' em '+dias+' dia(s) — '+ddmmaaaa(dta),
        k==='lipidico'
          ? 'Antes da coleta, discuta com o médico suspender a creatina por 2 a 4 semanas, evitar treino intenso nas 24 a 48 horas anteriores e evitar carga proteica na véspera. Sem esse preparo, o exame mede o treino, não o rim.'
          : 'Mantenha o mesmo avaliador e o mesmo protocolo de dobras. A dobra abdominal é o marcador-chave.']);
    else if(dias < 0)
      a.push(['warn','📆', nome+' venceu há '+(-dias)+' dia(s)', 'Reagende na aba Saúde.']);
  });
  return a;
}

/* ---------- 8. CABEÇALHO ---------- */
function renderTopo(){
  document.getElementById('dlbl').textContent = dia===hoje() ? 'hoje, '+fmtData(dia) : fmtData(dia);
  const t = totais(dia), m = metaDia(dia);
  const bd = document.getElementById('bdg');
  bd.textContent = fds(dia) ? 'fim de semana' : 'dia de semana';
  bd.className = 'badge'+(fds(dia)?' fds':'');
  const cel = (lb, v, meta, un, cls)=>{
    const pct = Math.min(100, meta? v/meta*100 : 0);
    let k = cls||''; if(!k){ k = pct>=95 && pct<=110 ? 'ok' : (pct>110?'over':''); }
    return `<div class="meta"><div class="lb">${lb}</div>
      <div class="vl">${v}<small>/${meta}${un||''}</small></div>
      <div class="bar"><i class="${k}" style="width:${pct}%"></i></div></div>`;
  };
  document.getElementById('metas').innerHTML =
    cel('kcal', t.kcal, m.kcal, '') + cel('prot', t.p, m.p, 'g', t.p>=S.cfg.protMin?'ok':'pr') +
    cel('carb', t.c, m.cb, 'g') + cel('gord', t.g, m.g, 'g');
}

function resumoSemanaTreino(){

function setTipo(t){

}
function carregarBib(sil){
  const tr=T(dia); (S.bib[tr.tipo]||[]).forEach(n=>{ if(!tr.ex.some(e=>e.nome===n)) tr.ex.push({nome:n, series:[serieVazia(n)]}); });
  salvar(); if(!sil){ msg('Treino '+tr.tipo+' carregado'); render(); }

function salvarBib(){ const tr=T(dia); S.bib[tr.tipo]=tr.ex.map(e=>e.nome); salvar(); msg('Salvo como treino '+tr.tipo); }
function serieVazia(nome){ const a=ultimaCarga(nome,dia); return a? {reps:a.reps,carga:a.carga,rpe:''} : {reps:'',carga:'',rpe:''}; }
function ultimaCarga(nome, ate){
  const ds = Object.keys(S.treinos).filter(d=>d<ate).sort().reverse();
  for(const d of ds){
    const e = (S.treinos[d].ex||[]).find(x=>x.nome===nome);
    if(e && e.series.some(s=>s.carga)){
      const boas = e.series.filter(s=>s.carga);
      const top = boas.reduce((a,b)=>parseFloat(b.carga)>parseFloat(a.carga)?b:a);
      return {d, reps:top.reps, carga:top.carga, txt: boas.map(s=>`${s.reps||'?'}×${s.carga}kg`).join('  ')};
    }
  }
  return null;
}
function addSerie(i){ const e=T(dia).ex[i]; const l=e.series[e.series.length-1];

function grafico(ms){
  const W=320,H=80,P=6;
  const pts = ms.filter(m=>m.peso).map(m=>({x:new Date(m.data+'T12:00').getTime(), y:parseFloat(m.peso)}));
  const pts2= ms.filter(m=>m.abdomen).map(m=>({x:new Date(m.data+'T12:00').getTime(), y:parseFloat(m.abdomen)}));
  if(pts.length<2 && pts2.length<2) return '<div class="muted">Ao menos duas medidas para desenhar a linha.</div>';
  const xs=[...pts,...pts2].map(p=>p.x), x0=Math.min(...xs), x1=Math.max(...xs)||x0+1;
  const line=(arr,minY,maxY,cor)=>{
    if(arr.length<2) return '';
    const px=p=>P+(p.x-x0)/(x1-x0||1)*(W-2*P), py=p=>H-P-(p.y-minY)/((maxY-minY)||1)*(H-2*P);
    return `<path d="${arr.map((p,i)=>`${i?'L':'M'}${px(p)},${py(p)}`).join(' ')}" fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round"/>`
      + arr.map(p=>`<circle cx="${px(p)}" cy="${py(p)}" r="2.5" fill="${cor}"/>`).join('');
  };
  const yA=pts.map(p=>p.y), yB=pts2.map(p=>p.y);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${line(pts, Math.min(...yA)-0.5, Math.max(...yA)+0.5, '#38bdf8')}
    ${line(pts2, Math.min(...yB)-1, Math.max(...yB)+1, '#fbbf24')}</svg>`;
}
function addMedida(){

  const o={data:d, peso:val('m_peso'), cintura:val('m_cint'), abdomen:val('m_abd'), obs:document.getElementById('m_obs').value};

      <button class="btn d sm" onclick="apagarTudo()">Apagar todos os dados</button></div>

  document.getElementById('t-dados').innerHTML = h;
}
function exportar(){
  const blob = blobBackup();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=nomeBackup(); a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000); msg('Backup gerado');
}
function blobBackup(){ return new Blob([JSON.stringify(S,null,1)], {type:'application/json'}); }
function nomeBackup(){ return 'rod-saude - registro diario - '+ddmmaaaa(hoje())+'.json'; }
function importar(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const novo=JSON.parse(r.result);
      if(!novo.dias&&!novo.treinos) throw 0;
      S = migrar(mesclar(base(), novo)); salvar(); render(); msg('Backup importado');
    }catch(e){ msg('Arquivo inválido'); } };
  r.readAsText(f); inp.value='';
}
function restaurarPlano(){
  if(!confirm('Restaurar o cardápio, os exames e as perguntas originais? Os seus registros diários não são tocados.')) return;

function apagarTudo(){
  if(!confirm('Apagar TODOS os registros deste aparelho? Exporte o backup antes.')) return;

/* ---------- 14. RESUMOS PARA O CLAUDE ---------- */
function resumoDia(d){
  const t=totais(d), m=metaDia(d), dd=D(d), tr=S.treinos[d];
  const L=[`DIA ${ddmmaaaa(d)} (${fds(d)?'fim de semana':'dia de semana'})`,
    `Consumido: ${t.kcal} kcal de ${m.kcal} | P ${t.p}g (alvo ${m.p}) | C ${t.c}g | G ${t.g}g | água ${(t.agua/1000).toFixed(1)}L${t.doses?' | '+t.doses+' doses de álcool':''}`];
  refeicoes().forEach(r=>{
    const marcados = r.itens.map((it,i)=>({it,q:dd.plano[r.id+'-'+i]})).filter(x=>x.q);
    const ex = extrasDe(d, r.id);
    if(!marcados.length && !ex.length) return;
    L.push(`${r.hora} ${r.nome}: ` +
      marcados.map(x=>x.it.n+(x.q!=1?' ('+x.q+'x)':'')).concat(ex.map(x=>'[fora do plano] '+x.e.n+(x.e.q>1?' x'+x.e.q:''))).join('; '));
  });
  const naoFeitas = S.plano.filter(r=>!refeicaoFeita(d,r)).map(r=>r.nome);
  if(naoFeitas.length) L.push('Não registrado: '+naoFeitas.join(', '));
  if(tr&&tr.tipo){
    let l='Treino: '+(tr.tipo==='off'?'descanso':(tr.tipo==='run'?'corrida':tr.tipo));
    (tr.ex||[]).forEach(e=>{ const s=e.series.filter(x=>x.carga||x.reps); if(s.length) l+=`\n  ${e.nome}: `+s.map(x=>`${x.reps||'?'}x${x.carga||'?'}kg${x.rpe?' RPE'+x.rpe:''}`).join(', '); });
    if(tr.cardio&&tr.cardio.km) l+=`\n  corrida ${tr.cardio.km} km em ${tr.cardio.min||'?'} min`;
    if(tr.obs) l+=`\n  nota: ${tr.obs}`;
    L.push(l);
  }
  if(dd.obs) L.push('Nota do dia: '+dd.obs);
  return L.join('\n');
}
function resumoSemana(){
  const hj=new Date(dia+'T12:00'); const L=['REGISTRO rod-saude — semana até '+ddmmaaaa(dia)];
  for(let i=6;i>=0;i--){
    const dt=new Date(hj); dt.setDate(dt.getDate()-i);
    const k=dt.toLocaleDateString('sv'); const t=totais(k), m=metaDia(k), tr=S.treinos[k], dd=S.dias[k];
    if(!dd&&!tr) continue;
    let l = ddmmaaaa(k)+' | '+t.kcal+' kcal (meta '+m.kcal+') | P '+t.p+'g C '+t.c+'g G '+t.g+'g | água '+(t.agua/1000).toFixed(1)+'L';
    if(t.doses) l += ' | '+t.doses+' doses';
    if(tr&&tr.tipo) l += ' | treino '+(tr.tipo==='off'?'descanso':tr.tipo);
    if(tr&&tr.cardio&&tr.cardio.km) l += ' | corrida '+tr.cardio.km+'km';
    const fora = ((dd&&dd.extras)||[]).map(e=>e.n+(e.q>1?' x'+e.q:'')).join(', ');
    if(fora) l += '\n   fora do plano: '+fora;
    if(dd&&dd.obs) l += '\n   nota: '+dd.obs;
    L.push(l);
  }
  const ult=S.medidas[S.medidas.length-1];
  if(ult) L.push('Última medida: '+ddmmaaaa(ult.data)+' — '+(ult.peso?ult.peso+'kg ':'')+(ult.cintura?'cintura '+ult.cintura+' ':'')+(ult.abdomen?'abdômen '+ult.abdomen:''));
  return L.join('\n');
}
function copiarResumo(){ copiar(resumoSemana()); }
function copiar(txt){
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(()=>msg('Copiado'),()=>fb(txt));
  else fb(txt);
  function fb(t){ const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0';
    document.body.appendChild(a); a.select();
    try{document.execCommand('copy'); msg('Copiado');}catch(e){msg('Não foi possível copiar');} a.remove(); }
}

function promptBase(tipo, pergunta){
  const cab = `Sou o Rodolfo. Estes dados vêm do meu app rod-saude. Meu plano: ${S.cfg.kcalSem} kcal de segunda a sexta e ${S.cfg.kcalFds} no fim de semana, proteína alvo ${S.cfg.protMeta} g, teto de ${S.cfg.dosesMax} doses de álcool por dia de fim de semana. Objetivo: perder gordura preservando massa magra. Colesterol/LDL no limite há anos e função renal a esclarecer com cistatina C.`;
  const rodape = `\n\nSe você for lançar alimentos no meu app, responda com uma linha por alimento, dentro de um bloco de código, exatamente neste formato:\n${FORMATO}\nRefeições: r1 pré-treino, r2 vitamina, r3 complemento, r4 lanche 10h, r5 almoço, r6 lanche 17h, r7 jantar, r8 extras.\nSe for atualizar o plano, os exames ou os exercícios, responda com um bloco de código JSON com as chaves que mudaram (plano, labs, estrutural, perguntas, cfg, exames, bib).`;
  const q = pergunta ? `\n\nMinha pergunta: ${pergunta}` : '';
  if(tipo==='dia')     return cab+`\n\n`+resumoDia(dia)+q+rodape;
  if(tipo==='semana')  return cab+`\n\n`+resumoSemana()+q+rodape;
  return cab+`\n\nSegue o backup completo do app em anexo (.json): histórico de refeições, treinos com carga por exercício e medidas. Analise a aderência, a tendência de peso e de abdômen, e me diga o que ajustar.`+q+rodape;
}
async function enviarClaude(tipo){
  const q = (document.getElementById('cl_q')||{}).value || '';
  const texto = promptBase(tipo, q.trim());
  if(tipo==='backup'){
    const file = new File([blobBackup()], nomeBackup(), {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], text:texto, title:'rod-saude'}); fechar(); return; }catch(e){ if(e.name==='AbortError'){ return; } }
    }
    exportar(); copiar(texto); msg('Arquivo baixado e texto copiado');
    abrirClaudeWeb(); return;
  }
  if(navigator.share){
    try{ await navigator.share({text:texto, title:'rod-saude'}); fechar(); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  copiar(texto); abrirClaudeWeb();
}

/* aplica a resposta do Claude: linhas #RS ou JSON de atualização */
function aplicarClaude(){
  const txt = (document.getElementById('cl_in')||{}).value || '';
  if(!txt.trim()){ msg('Cole a resposta do Claude'); return; }
  let n = aplicarLinhasRS(txt);
  let j = aplicarJSON(txt);
  if(!n && !j){ msg('Não reconheci nada no texto colado'); return; }
  salvar(); fechar(); render();
  msg((n?n+' alimento(s) lançado(s). ':'') + (j?'Plano atualizado.':''));
}
function aplicarLinhasRS(txt){
  const dd = D(dia); let n=0;
  txt.split(/\r?\n/).forEach(l=>{
    l = l.replace(/^\s*[`>*-]*\s*/,'').trim();
    if(!/^#RS\b/i.test(l)) return;
    const p = l.replace(/^#RS\d*\s*\|?\s*/i,'').split('|').map(x=>x.trim());
    if(p.length < 6) return;
    let ref = (p[0].match(/r[1-8]/i)||['r8'])[0].toLowerCase();
    const num = s => { const v=parseFloat(String(s).replace(',','.').replace(/[^0-9.\-]/g,'')); return isNaN(v)?0:v; };
    dd.extras.push({ref, n:p[1], kcal:num(p[2]), p:num(p[3]), c:num(p[4]), g:num(p[5]), q:1, est:true});
    abertos.add(ref); n++;
  });
  return n;
}
function aplicarJSON(txt){
  const m = txt.match(/\{[\s\S]*\}/);
  if(!m) return 0;
  let o; try{ o = JSON.parse(m[0]); }catch(e){ return 0; }
  let mudou = 0;
  if(Array.isArray(o.plano) && o.plano.length){ S.plano=o.plano; mudou++; }
  if(Array.isArray(o.labs) && o.labs.length){ S.labs=o.labs; mudou++; }
  if(Array.isArray(o.estrutural) && o.estrutural.length){ S.estrutural=o.estrutural; mudou++; }
  if(Array.isArray(o.perguntas) && o.perguntas.length){ S.perguntas=o.perguntas; mudou++; }
  if(o.cfg && typeof o.cfg==='object'){ Object.assign(S.cfg, o.cfg); mudou++; }
  if(o.exames && typeof o.exames==='object'){ Object.assign(S.exames, o.exames); mudou++; }
  if(o.bib && typeof o.bib==='object'){ Object.assign(S.bib, o.bib); mudou++; }
  if(mudou){ S.atualizacoes = S.atualizacoes||[]; S.atualizacoes.push({d:hoje(), chaves:Object.keys(o)}); }
  return mudou;
}
